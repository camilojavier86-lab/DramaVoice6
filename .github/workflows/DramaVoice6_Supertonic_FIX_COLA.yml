name: Build DramaVoice Supertonic FIX Cola

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DramaVoice6_Supertonic_FIX_COLA.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone sherpa-onnx v1.13.8
        run: git clone --depth 1 --branch v1.13.8 https://github.com/k2-fsa/sherpa-onnx.git sherpa-onnx

      - name: Download official Supertonic engine
        run: |
          curl -L --fail --retry 5 "https://huggingface.co/csukuangfj2/sherpa-onnx-apk/resolve/main/tts-engine-new/1.13.8/sherpa-onnx-1.13.8-arm64-v8a-eng-tts-engine-sherpa-onnx-supertonic-3-tts-int8-2026-05-11.apk?download=true" -o official-supertonic.apk
          rm -rf official-apk
          mkdir -p official-apk
          unzip -q official-supertonic.apk -d official-apk
          test -d official-apk/assets
          test -d official-apk/lib/arm64-v8a

      - name: Reuse official model and native libraries
        run: |
          APP="sherpa-onnx/android/SherpaOnnxTtsEngine/app/src/main"
          mkdir -p "$APP/assets" "$APP/jniLibs/arm64-v8a"
          cp -a official-apk/assets/. "$APP/assets/"
          cp -a official-apk/lib/arm64-v8a/. "$APP/jniLibs/arm64-v8a/"

      - name: Patch DramaVoice Supertonic
        run: |
          echo '' | base64 --decode > /tmp/dv6_patch.py
          python3 /tmp/dv6_patch.py

      - name: Restore persistent DV6 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dv6-supertonic-debug-keystore-v1

      - name: Ensure persistent DV6 signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=DramaVoice,C=PA"
          fi

      - name: Build installable APK
        run: |
          cd sherpa-onnx/android/SherpaOnnxTtsEngine
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp sherpa-onnx/android/SherpaOnnxTtsEngine/app/build/outputs/apk/debug/app-debug.apk DramaVoice-Supertonic-FINAL-Panama-FIX-COLA.apk
          ls -lh DramaVoice-Supertonic-FINAL-Panama-FIX-COLA.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DramaVoice-Supertonic-FINAL-Panama-FIX-COLA
          path: DramaVoice-Supertonic-FINAL-Panama-FIX-COLA.apk
          if-no-files-found: error
