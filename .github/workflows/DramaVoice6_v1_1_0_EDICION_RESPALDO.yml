name: Actualizar DramaVoice 6 v1.1.0 edicion y respaldo

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DramaVoice6_v1_1_0_EDICION_RESPALDO.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar v1.1.0
        shell: bash
        run: |
          set -e
          echo '' | base64 --decode > /tmp/dv110_patch.py
          python3 /tmp/dv110_patch.py
      - name: Validar cambios
        shell: bash
        run: |
          set -e
          grep -q 'dv110-script' index.html
          grep -q 'dv110SoundCreator' index.html
          grep -q '"displayVersion": "1.1.0"' version.json
          grep -q "DV6_SW_VERSION='1.1.0'" service-worker.js
          if grep -q '<script id="dv50-native-audio-script">' index.html; then echo 'ERROR: sigue presente el parche web Supertonic v50'; exit 1; fi
      - name: Guardar cambios
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          if git diff --cached --quiet; then echo 'No hay cambios nuevos.'; exit 0; fi
          git commit -m "DramaVoice 6 v1.1.0: edicion de escenas y respaldo Android"
          git push
