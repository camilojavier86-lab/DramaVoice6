name: EMERGENCIA Restaurar DramaVoice estable

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DramaVoice6_EMERGENCIA_RESTAURAR_ESTABLE.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar archivos estables anteriores a v1.1.0
        shell: bash
        run: |
          set -e
          git checkout 8f248182babc52b0ea23ba24c84b9d30ce328e10 -- index.html version.json service-worker.js

      - name: Validar restauracion
        shell: bash
        run: |
          set -e
          test -s index.html
          test -s version.json
          test -s service-worker.js
          if grep -q 'dv110-script' index.html; then
            echo "ERROR: el parche v1.1.0 sigue presente"
            exit 1
          fi
          echo "Restauracion validada."

      - name: Publicar restauracion
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          if git diff --cached --quiet; then
            echo "Los archivos ya estaban restaurados."
            exit 0
          fi
          git commit -m "Emergency rollback: restore stable DramaVoice before v1.1.0"
          git push
