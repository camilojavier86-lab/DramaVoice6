name: DV6 inspeccion controls personajes 10108 (sin cambiar app)
on:
  push:
    paths:
      - '.github/workflows/DV6_INSPECT_VOICES.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extraer código existente de controles de voz
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          pats=[
            r'Velocidad',r'Tono',r'voice.?rate',r'voice.?pitch',r'pitch',r'\.rate',r'getVoice',
            r'Voz del dispositivo',r'Probar narrador',r'Probar voz',r'previewVoice',
            r'characterRecordForName',r'renderCharacter',r'renderChar',r'saveLib',
            r'voiceURI',r'rateInput',r'pitchInput'
          ]
          out=[]
          out.append(f'Base version: {Path("version.json").read_text(encoding="utf-8")[:190]}')
          out.append(f'INDEX bytes={len(s.encode())}, total lines={len(lines)}')
          for pat in pats:
            hits=[i for i,l in enumerate(lines) if re.search(pat,l,re.I)]
            out.append(f'\n### {pat}: {len(hits)} matches')
            for i in hits[:15]:
              out.append(f'\n--- around line {i+1} ---')
              out.extend(f'{j+1}: {lines[j][:370]}' for j in range(max(0,i-4),min(len(lines),i+6)))
          Path('.github/DV6_VOICE_INSPECTION_10108.txt').write_text('\n'.join(out)[:93000],encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/DV6_VOICE_INSPECTION_10108.txt
          git diff --cached --quiet || { git commit -m "Inspect existing DV6 voice controls only"; git push; }
