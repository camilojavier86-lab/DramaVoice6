name: DramaVoice 6 v1.0.3 - Recuperar voz Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DV6_v1.0.3_FIX.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar recuperación de voz Android
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re

          index=Path("index.html")
          if not index.exists():
              raise RuntimeError("No existe index.html.")

          text=index.read_text(encoding="utf-8")
          fallback=base64.b64decode("").decode("utf-8")

          if 'id="dv103-system-tts-fallback"' not in text:
              if "</body>" not in text:
                  raise RuntimeError("No se encontró </body> en index.html.")
              text=text.replace("</body>", fallback+"\\n</body>", 1)

          # Actualizar identificadores cuando existan, pero no fallar por diferencias
          # entre versiones anteriores del HTML.
          text,n=re.subn(r"const DV6_APP_VERSION=\d+;", "const DV6_APP_VERSION=10003;", text, count=1)
          if n==0:
              print("Aviso: DV6_APP_VERSION no estaba presente; se continúa.")

          text,n=re.subn(r'<meta name="dv6-version" content="\d+">', '<meta name="dv6-version" content="10003">', text, count=1)
          if n==0:
              print("Aviso: meta dv6-version no estaba presente; se continúa.")

          text=re.sub(r'Versión instalada: v[^<\\n]+', 'Versión instalada: v1.0.3', text, count=1)

          index.write_text(text, encoding="utf-8")

          version={
            "version":10003,
            "displayVersion":"1.0.3",
            "build":"2026.09.27.10003",
            "date":"27 sep 2026",
            "title":"Recuperar voz Android predeterminada",
            "updateRequired":False,
            "changes":[
              "Añade un fallback de voz Android predeterminada cuando no existe catálogo de voces.",
              "No modifica el APK, Supertonic, sonidos, fotos, escenas ni datos locales.",
              "Esta versión se limita exclusivamente a recuperar reproducción de voz."
            ]
          }
          Path("version.json").write_text(json.dumps(version,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")

          sw=Path("service-worker.js")
          if sw.exists():
              swt=sw.read_text(encoding="utf-8")
              swt,n=re.subn(r"const DV6_SW_VERSION='[^']+';", "const DV6_SW_VERSION='1.0.3';", swt, count=1)
              if n==0:
                  print("Aviso: DV6_SW_VERSION no estaba presente; se conserva service-worker.")
              else:
                  sw.write_text(swt,encoding="utf-8")

          final=index.read_text(encoding="utf-8")
          for token in ['id="dv103-system-tts-fallback"','Android predeterminada','dv6-system-default']:
              if token not in final:
                  raise RuntimeError("Validación falló: "+token)

          if "dv110-script" in final:
              raise RuntimeError("Se detectó el parche v1.1.0 defectuoso; se aborta.")

          print("DramaVoice 6 v1.0.3 VOZ validada.")

          PY

      - name: Validar
        shell: bash
        run: |
          set -e
          grep -q 'dv103-system-tts-fallback' index.html
          grep -q 'Android predeterminada' index.html
          grep -q '"displayVersion": "1.0.3"' version.json

      - name: Guardar actualización
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi
          git commit -m "DramaVoice 6 v1.0.3: recuperar voz Android"
          git push
