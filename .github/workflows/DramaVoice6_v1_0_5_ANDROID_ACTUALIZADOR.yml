name: Build DramaVoice 6 v1.0.5 - Actualizador Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore persistent DV6 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dramavoice6-signing-v54-v1

      - name: Ensure persistent signing key
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=DramaVoice 6,O=K-MILO,C=PA" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA256:|Valid from:" | tee DV6_SIGNING_FINGERPRINT.txt

      - name: Reutilizar proyecto Android v54
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          src_path=Path(".github/workflows/DramaVoice6_v54_ANDROID_TTS.yml")
          if not src_path.exists():
              raise SystemExit("ERROR: no existe DramaVoice6_v54_ANDROID_TTS.yml")

          src=src_path.read_text(encoding="utf-8")
          step="      - name: Create Android v54 project\n"
          if step not in src:
              raise SystemExit("ERROR: no se encontró la receta Android v54.")

          start=src.index(step)
          run_marker="        run: |\n"
          run_pos=src.index(run_marker,start)+len(run_marker)
          end_marker="\n      - name: Validate v54 voice architecture"
          end=src.index(end_marker,run_pos)

          body=textwrap.dedent(src[run_pos:end])
          Path("create_android_v55.sh").write_text(body,encoding="utf-8")
          PY

          bash create_android_v55.sh

      - name: Actualizar contenedor Android para DramaVoice v1.0.5
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          gradle=Path("app/build.gradle.kts")
          s=gradle.read_text(encoding="utf-8")
          s=s.replace('versionCode = 54','versionCode = 55')  # interno Android; no es la versión visible
          s=s.replace('versionName = "54.0"','versionName = "1.0.5"')
          gradle.write_text(s,encoding="utf-8")

          java=Path("app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java")
          s=java.read_text(encoding="utf-8")

          if "WebSettings.LOAD_DEFAULT" not in s:
              raise SystemExit("ERROR: no se encontró LOAD_DEFAULT en MainActivity.")
          s=s.replace(
              "settings.setCacheMode(WebSettings.LOAD_DEFAULT);",
              "settings.setCacheMode(WebSettings.LOAD_NO_CACHE);",
              1
          )

          if "webView.loadUrl(APP_URL);" not in s:
              raise SystemExit("ERROR: no se encontró carga inicial APP_URL.")
          s=s.replace(
              "webView.loadUrl(APP_URL);",
              'webView.loadUrl(APP_URL + "?androidShell=55&t=" + System.currentTimeMillis());',
              1
          )

          java.write_text(s,encoding="utf-8")

          bridge=Path("app/src/main/assets/native-bridge.js")
          s=bridge.read_text(encoding="utf-8")

          s=s.replace(
              "if(sub)sub.textContent='v54 · Android TTS nativo';",
              "/* v55: la versión visible la controla la interfaz web oficial. */"
          )
          s=s.replace(
              "if(versionLine)versionLine.textContent='Versión instalada: v54 Android TTS';",
              "/* v55: no sobreescribir la versión oficial de DramaVoice. */"
          )

          hard_patch=r'''
          ;(()=>{
            if(window.__DV6_ANDROID_SHELL_V55)return;
            window.__DV6_ANDROID_SHELL_V55=true;

            const APP='https://camilojavier86-lab.github.io/DramaVoice6/';
            let busy=false;

            function localVersion(){
              const meta=document.querySelector('meta[name="dv6-version"]');
              return Number(meta?.content||0)||0;
            }

            function statusElements(){
              return {
                status:document.getElementById('dv105UpdateStatus') || document.getElementById('projectStatus'),
                state:document.getElementById('dv105UpdateState')
              };
            }

            function setStatus(message,state=''){
              const els=statusElements();
              if(els.status){
                els.status.textContent=message;
                els.status.className='status good';
              }
              if(els.state&&state)els.state.textContent=state;
            }

            async function remoteVersion(){
              const r=await fetch(APP+'version.json?t='+Date.now(),{
                cache:'no-store',
                headers:{'Cache-Control':'no-cache, no-store, must-revalidate'}
              });
              if(!r.ok)throw new Error('HTTP '+r.status);
              return await r.json();
            }

            async function purgeOldWebApp(){
              try{
                if('serviceWorker' in navigator){
                  const regs=await navigator.serviceWorker.getRegistrations();
                  await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
                }
              }catch(e){}
              try{
                if('caches' in window){
                  const keys=await caches.keys();
                  await Promise.all(
                    keys.filter(k=>String(k).startsWith('dramavoice6-'))
                        .map(k=>caches.delete(k).catch(()=>false))
                  );
                }
              }catch(e){}
            }

            function displayVersion(info){
              return String(info?.displayVersion||info?.version||'').replace(/^v/i,'');
            }

            async function applyLatest(info){
              setStatus(
                'Aplicando DramaVoice v'+displayVersion(info)+'…',
                '⚙️ Actualizando…'
              );
              try{if(typeof saveResume==='function')saveResume()}catch(e){}
              try{
                const tab=document.querySelector('.tab.active')?.dataset?.tab||'historia';
                sessionStorage.setItem('dv6-v55-return-tab',tab);
              }catch(e){}

              await purgeOldWebApp();

              const url=APP+'?dv6='+encodeURIComponent(info?.version||Date.now())+'&t='+Date.now();
              location.replace(url);
            }

            async function checkUpdate(manual=true){
              if(busy)return;
              busy=true;
              const btn=document.getElementById('checkUpdatesBtn');
              if(btn)btn.disabled=true;

              if(manual)setStatus('Buscando la versión más reciente…','🔎 Buscando…');

              try{
                const info=await remoteVersion();
                const remote=Number(info?.version||0)||0;
                const local=localVersion();

                if(remote>local){
                  await applyLatest(info);
                  return;
                }

                if(manual){
                  setStatus(
                    'Ya estás usando DramaVoice v'+displayVersion(info)+
                    (info?.build?' · compilación '+info.build:'')+'.',
                    '✅ Actualizado'
                  );
                }
              }catch(err){
                if(manual)setStatus('No se pudo comprobar la actualización.','⚠️ Sin comprobar');
                console.warn('DV6 Android v55 updater',err);
              }finally{
                busy=false;
                if(btn)btn.disabled=false;
              }
            }

            function bindButton(){
              const btn=document.getElementById('checkUpdatesBtn');
              if(!btn||btn.dataset.dv55Bound==='1')return;
              btn.dataset.dv55Bound='1';

              btn.addEventListener('click',e=>{
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                checkUpdate(true);
              },true);
            }

            function restoreTab(){
              try{
                const tab=sessionStorage.getItem('dv6-v55-return-tab');
                if(!tab)return;
                sessionStorage.removeItem('dv6-v55-return-tab');
                if(typeof goTab==='function')goTab(tab);
              }catch(e){}
            }

            bindButton();
            restoreTab();

            const observer=new MutationObserver(bindButton);
            if(document.body)observer.observe(document.body,{childList:true,subtree:true});

            setTimeout(bindButton,350);
            setTimeout(bindButton,1100);

            // Si el WebView abrió una página vieja, corrígela automáticamente una sola vez.
            setTimeout(()=>checkUpdate(false),900);
          })();
          '''

          bridge.write_text(s+"\n"+hard_patch+"\n",encoding="utf-8")
          PY

      - name: Validar contenedor Android v1.0.5
        shell: bash
        run: |
          set -e
          grep -q 'versionCode = 55' app/build.gradle.kts
          grep -q 'versionName = "1.0.5"' app/build.gradle.kts
          grep -q 'WebSettings.LOAD_NO_CACHE' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'androidShell=55' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q '__DV6_ANDROID_SHELL_V55' app/src/main/assets/native-bridge.js
          grep -q 'getRegistrations' app/src/main/assets/native-bridge.js
          grep -q 'caches.keys' app/src/main/assets/native-bridge.js
          grep -q 'Android TTS conectado' app/src/main/assets/native-bridge.js
          grep -q 'new TextToSpeech(context, status ->' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'Set<Voice> voiceSet = tts.getVoices()' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java

          if grep -Rni 'SUPERTONIC_ENGINE\|com.dramavoice6.supertonic\|DV6 Supertonic' app/src/main; then
            echo "ERROR: apareció una dependencia Supertonic."
            exit 1
          fi

          echo "OK: DramaVoice v1.0.5 conserva Android TTS y añade actualizador fuerte sin cambiar la muesca."

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e
          curl -L --fail --retry 4 \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            -o gradle.zip
          unzip -q gradle.zip

      - name: Build DramaVoice 6 v1.0.5 APK
        shell: bash
        run: |
          set -e
          ./gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DramaVoice6-v1.0.5-build10005.apk
          ls -lh DramaVoice6-v1.0.5-build10005.apk

      - name: Upload v55 APK
        uses: actions/upload-artifact@v4
        with:
          name: DramaVoice6-v1.0.5-build10005
          path: |
            DramaVoice6-v1.0.5-build10005.apk
            DV6_SIGNING_FINGERPRINT.txt
          if-no-files-found: error
          retention-days: 30
