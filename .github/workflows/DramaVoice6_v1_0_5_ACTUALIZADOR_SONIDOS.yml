name: Actualizar DramaVoice 6 v1.0.5 - Actualizador y sonidos por capa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar v1.0.5
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, json, re

          INDEX=Path("index.html")
          VERSION=Path("version.json")
          SW=Path("service-worker.js")

          for p in (INDEX,VERSION,SW):
              if not p.exists():
                  raise SystemExit(f"ERROR: falta {p}")

          current=json.loads(VERSION.read_text(encoding="utf-8"))
          current_num=int(current.get("version",0) or 0)
          if current_num>10005:
              raise SystemExit("ERROR: el repositorio ya contiene una versión posterior a v1.0.5.")

          html=INDEX.read_text(encoding="utf-8")
          if "renderSceneSoundEditor" not in html or "checkUpdatesBtn" not in html:
              raise SystemExit("ERROR: no se encontró la estructura esperada de DramaVoice.")

          js_patch=base64.b64decode("").decode("utf-8")
          Path("dv105_patch_check.js").write_text(js_patch,encoding="utf-8")
          marker="__DV6_V105"
          patch='<script id="dv6-v105-patch">\n'+js_patch+'\n</script>'

          if marker not in html:
              if "</body>" not in html:
                  raise SystemExit("ERROR: index.html no contiene </body>.")
              html=html.replace("</body>",patch+"\n</body>",1)

          html,n=re.subn(
              r'<meta name="dv6-version" content="[^"]*">',
              '<meta name="dv6-version" content="10005">',
              html,count=1
          )
          if n!=1:
              raise SystemExit("ERROR: no se pudo actualizar meta dv6-version.")

          html,n=re.subn(
              r'const\s+DV6_APP_VERSION\s*=\s*\d+\s*;',
              'const DV6_APP_VERSION=10005;',
              html,count=1
          )
          if n!=1:
              raise SystemExit("ERROR: no se pudo actualizar DV6_APP_VERSION.")

          html=re.sub(
              r'<title>DramaVoice 6[^<]*</title>',
              '<title>DramaVoice 6 v1.0.5</title>',
              html,count=1
          )

          html=re.sub(
              r'Versión instalada:\s*[^<]+',
              'Versión instalada: v1.0.5',
              html,count=1
          )

          INDEX.write_text(html,encoding="utf-8")

          VERSION.write_text(json.dumps({
              "version":10005,
              "displayVersion":"1.0.5",
              "build":"2026.09.27-10005",
              "date":"27 sep 2026",
              "title":"Actualizador moderno y sonidos por capa",
              "updateRequired":False,
              "changes":[
                  "Buscar actualizaciones ahora comprueba, descarga, aplica y refresca DramaVoice dentro de la propia app, sin pedir cerrar y volver a abrir.",
                  "Ajustes muestra por separado versión instalada, compilación, plataforma, motor de voz y estado de actualización.",
                  "La versión oficial visible pasa a v1.0.5; v54 deja de mostrarse como si fuera la versión funcional de DramaVoice.",
                  "Cada capa de sonido permite Crear sonido nuevo, elegir archivo o grabar, definir tipo, familia y categoría, y asignarlo automáticamente a esa capa.",
                  "Elimina el texto residual \\n que podía aparecer suelto en pantalla.",
                  "Conserva Android TTS y no modifica el contenedor Android ni el comportamiento de la muesca."
              ]
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          sw=SW.read_text(encoding="utf-8")
          sw,n=re.subn(
              r"const\s+DV6_SW_VERSION\s*=\s*['\"][^'\"]+['\"]\s*;",
              "const DV6_SW_VERSION='1.0.5';",
              sw,count=1
          )
          if n!=1:
              raise SystemExit("ERROR: no se pudo actualizar DV6_SW_VERSION.")
          SW.write_text(sw,encoding="utf-8")

          print("DramaVoice v1.0.5 preparada.")
          PYCODE

      - name: Validar JavaScript y archivos
        shell: bash
        run: |
          set -e
          node --check dv105_patch_check.js
          rm -f dv105_patch_check.js

          grep -q "__DV6_V105" index.html
          grep -q "DV6_APP_VERSION=10005;" index.html
          grep -q "Crear sonido nuevo" index.html
          grep -q "Buscar actualizaciones" index.html
          grep -q '"displayVersion": "1.0.5"' version.json
          grep -q '"build": "2026.09.27-10005"' version.json
          grep -q "DV6_SW_VERSION='1.0.5'" service-worker.js

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html service-worker.js version.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "ERROR: se modificaron archivos inesperados:"
            echo "$changed"
            exit 1
          fi

          git diff --check
          echo "OK: v1.0.5 validada. No se modificó el builder Android ni la muesca."

      - name: Guardar actualización
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js

          if git diff --cached --quiet; then
            echo "La v1.0.5 ya estaba aplicada."
            exit 0
          fi

          git commit -m "DramaVoice 6 v1.0.5: updater moderno y crear sonido por capa"
          git push
