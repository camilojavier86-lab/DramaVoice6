name: DramaVoice 6 v1.1.1 - Android v55 interfaz + portapapeles build10108

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore persistent DV6 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dramavoice6-signing-v54-v1

      - name: Ensure persistent signing key
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=DramaVoice 6,O=K-MILO,C=PA" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA256:|Valid from:" | tee DV6_SIGNING_FINGERPRINT.txt

          EXPECTED_SHA256="D1:19:8A:C5:72:A1:CB:97:EB:69:00:A8:1D:0E:01:CE:B8:96:E9:CF:AE:5D:42:25:01:49:9B:12:80:5D:71:2C"
          ACTUAL_SHA256="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1)"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: la firma no coincide con la instalación estable."
            echo "Esperada: $EXPECTED_SHA256"
            echo "Actual:   $ACTUAL_SHA256"
            exit 1
          fi
          echo "OK: firma estable verificada."

      - name: Create Android v55 project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/dramavoice6/nativeapp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle.kts <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DramaVoice6Native"
          include(":app")
          EOF_SETTINGS

          cat > build.gradle.kts <<'EOF_ROOT'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF_ROOT

          cat > app/build.gradle.kts <<'EOF_APP'
          plugins {
              id("com.android.application")
          }
          
          android {
              namespace = "com.dramavoice6.nativeapp"
              compileSdk = 35
          
              defaultConfig {
                  applicationId = "com.dramavoice6.nativeapp"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 55
                  versionName = "55.0"
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF_APP

          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
          
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
          
              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:label="DramaVoice 6"
                  android:icon="@drawable/dv6_icon"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat > app/src/main/res/values/styles.xml <<'EOF_STYLES'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#7C3AED</item>
                  <item name="android:statusBarColor">#07090D</item>
                  <item name="android:navigationBarColor">#07090D</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF_STYLES

          cat > app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java <<'EOF_JAVA'
          package com.dramavoice6.nativeapp;
          
          import android.Manifest;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.ClipboardManager;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          
          public class MainActivity extends Activity {
              private static final String APP_URL = "https://camilojavier86-lab.github.io/DramaVoice6/";
              private static final int FILE_CHOOSER_REQUEST = 501;
              private static final int AUDIO_PERMISSION_REQUEST = 502;
          
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private PermissionRequest pendingPermissionRequest;
              private TtsBridge ttsBridge;
              private String injectedPatch = "";
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(7, 9, 13));
                  getWindow().setNavigationBarColor(Color.rgb(7, 9, 13));
          
                  webView = new WebView(this);

                  // Respeta la barra superior real de Android 15/16.
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(7, 9, 13));
                  root.addView(webView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  ));
                  root.setOnApplyWindowInsetsListener((v, insets) -> {
                      int top = insets.getSystemWindowInsetTop();
                      int left = insets.getSystemWindowInsetLeft();
                      int right = insets.getSystemWindowInsetRight();
                      v.setPadding(left, top, right, 0);
                      return insets;
                  });
                  setContentView(root);
                  root.requestApplyInsets();
          
                  injectedPatch = readAssetText("native-bridge.js");
                  ttsBridge = new TtsBridge(this);
          
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
          
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
          
                  webView.addJavascriptInterface(ttsBridge, "DramaVoiceNativeTTS");
          
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost() == null ? "" : uri.getHost();
                          if (host.equals("camilojavier86-lab.github.io")) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                              return true;
                          } catch (Exception e) {
                              return false;
                          }
                      }
          
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          injectNativePatch();
                      }
                  });
          
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallbackNew,
                              FileChooserParams fileChooserParams) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = filePathCallbackNew;
                          try {
                              Intent intent = fileChooserParams.createIntent();
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              Toast.makeText(MainActivity.this, "No pude abrir el selector de archivos.", Toast.LENGTH_SHORT).show();
                              return false;
                          }
                      }
          
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> {
                              boolean wantsAudio = false;
                              for (String r : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) wantsAudio = true;
                              }
                              if (!wantsAudio) {
                                  request.deny();
                                  return;
                              }
                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                              } else {
                                  pendingPermissionRequest = request;
                                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, AUDIO_PERMISSION_REQUEST);
                              }
                          });
                      }
                  });
          
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      if (url == null || !url.startsWith("http")) {
                          Toast.makeText(MainActivity.this,
                                  "Este tipo de descarga se maneja dentro de DramaVoice.",
                                  Toast.LENGTH_SHORT).show();
                          return;
                      }
                      try {
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          request.setMimeType(mimetype);
                          request.addRequestHeader("User-Agent", userAgent);
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "DramaVoice_descarga");
                          DownloadManager dm = (DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                          dm.enqueue(request);
                      } catch (Exception e) {
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                      }
                  });
          
                  webView.loadUrl(APP_URL);
              }
          
              private String readAssetText(String name) {
                  try {
                      InputStream in = getAssets().open(name);
                      BufferedReader reader = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = reader.readLine()) != null) sb.append(line).append('\n');
                      reader.close();
                      return sb.toString();
                  } catch (Exception e) {
                      return "";
                  }
              }
          
              private void injectNativePatch() {
                  if (injectedPatch == null || injectedPatch.isEmpty()) return;
                  webView.evaluateJavascript(injectedPatch, null);
              }
          
              private void notifyTtsReady() {
                  runOnUiThread(() -> {
                      if (webView != null) {
                          webView.evaluateJavascript(
                                  "try{if(typeof loadVoices==='function')loadVoices();}catch(e){}",
                                  null
                          );
                      }
                  });
              }
          
              private void dispatchTtsEvent(String id, String event, String error) {
                  if (webView == null) return;
                  final String js = "try{if(window.dv6NativeTtsEvent)window.dv6NativeTtsEvent("
                          + JSONObject.quote(id == null ? "" : id) + ","
                          + JSONObject.quote(event == null ? "" : event) + ","
                          + JSONObject.quote(error == null ? "" : error) + ");}catch(e){}";
                  runOnUiThread(() -> webView.evaluateJavascript(js, null));
              }
          
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (filePathCallback != null) {
                          Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }
          
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == AUDIO_PERMISSION_REQUEST && pendingPermissionRequest != null) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          pendingPermissionRequest.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                      } else {
                          pendingPermissionRequest.deny();
                      }
                      pendingPermissionRequest = null;
                  }
              }
          
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          
              @Override
              protected void onDestroy() {
                  if (ttsBridge != null) ttsBridge.shutdown();
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          
              public class TtsBridge {
                  private final Context context;
                  private final Handler mainHandler = new Handler(Looper.getMainLooper());
                  private TextToSpeech tts;
                  private volatile boolean ready = false;
          
                  TtsBridge(Context context) {
                      this.context = context;
                      tts = new TextToSpeech(context, status -> {
                          ready = status == TextToSpeech.SUCCESS;
                          if (ready) {
                              try {
                                  int r = tts.setLanguage(new Locale("es", "PA"));
                                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                                      tts.setLanguage(new Locale("es"));
                                  }
                              } catch (Exception ignored) {}
          
                              tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                  @Override
                                  public void onStart(String utteranceId) {
                                      dispatchTtsEvent(utteranceId, "start", "");
                                  }
          
                                  @Override
                                  public void onDone(String utteranceId) {
                                      dispatchTtsEvent(utteranceId, "done", "");
                                  }
          
                                  @Override
                                  public void onError(String utteranceId) {
                                      dispatchTtsEvent(utteranceId, "error", "error");
                                  }
          
                                  @Override
                                  public void onError(String utteranceId, int errorCode) {
                                      dispatchTtsEvent(utteranceId, "error", "código " + errorCode);
                                  }
          
                                  @Override
                                  public void onStop(String utteranceId, boolean interrupted) {
                                      dispatchTtsEvent(utteranceId, "stop", interrupted ? "interrumpido" : "");
                                  }
                              });
                          }
                          notifyTtsReady();
                      });
                  }
          
                  @JavascriptInterface
                  public boolean isReady() {
                      return ready && tts != null;
                  }
          
                  @JavascriptInterface
                  public String getVoicesJson() {
                      JSONArray arr = new JSONArray();
                      if (!isReady()) return arr.toString();
          
                      try {
                          Set<Voice> voiceSet = tts.getVoices();
                          if (voiceSet == null) return arr.toString();
          
                          List<Voice> voiceList = new ArrayList<>(voiceSet);
                          Voice current = tts.getVoice();
          
                          Collections.sort(voiceList, new Comparator<Voice>() {
                              @Override
                              public int compare(Voice a, Voice b) {
                                  String la = a.getLocale() == null ? "" : a.getLocale().toLanguageTag();
                                  String lb = b.getLocale() == null ? "" : b.getLocale().toLanguageTag();
                                  boolean aEs = la.toLowerCase(Locale.ROOT).startsWith("es");
                                  boolean bEs = lb.toLowerCase(Locale.ROOT).startsWith("es");
                                  if (aEs != bEs) return aEs ? -1 : 1;
                                  boolean aLocal = !a.isNetworkConnectionRequired();
                                  boolean bLocal = !b.isNetworkConnectionRequired();
                                  if (aLocal != bLocal) return aLocal ? -1 : 1;
                                  return String.valueOf(a.getName()).compareToIgnoreCase(String.valueOf(b.getName()));
                              }
                          });
          
                          for (Voice v : voiceList) {
                              String name = v.getName() == null ? "" : v.getName();
                              if (name.isEmpty()) continue;
          
                              JSONObject o = new JSONObject();
                              o.put("name", name);
                              o.put("voiceURI", "native:" + name);
          
                              Locale locale = v.getLocale();
                              String tag = locale == null ? "" : locale.toLanguageTag();
                              if (tag == null || tag.isEmpty()) tag = "und";
                              o.put("lang", tag);
          
                              o.put("localService", !v.isNetworkConnectionRequired());
                              o.put("default", current != null && name.equals(current.getName()));
                              arr.put(o);
                          }
                      } catch (Exception ignored) {}
          
                      return arr.toString();
                  }
          
                  @JavascriptInterface
                  public boolean speak(String text, String voiceName, double rate, double pitch, double volume, String utteranceId) {
                      if (!isReady() || text == null || text.trim().isEmpty()) return false;
          
                      final String safeText = text;
                      final String safeVoice = voiceName == null ? "" : voiceName.replaceFirst("^native:", "");
                      final float safeRate = (float)Math.max(0.1, Math.min(5.0, rate));
                      final float safePitch = (float)Math.max(0.5, Math.min(2.0, pitch));
                      final float safeVolume = (float)Math.max(0.0, Math.min(1.0, volume));
                      final String safeId = utteranceId == null ? ("dv6-" + System.currentTimeMillis()) : utteranceId;
          
                      runOnUiThread(() -> {
                          try {
                              if (tts == null) return;
                              tts.stop();
          
                              mainHandler.postDelayed(() -> {
                                  try {
                                      if (tts == null || !ready) {
                                          dispatchTtsEvent(safeId, "error", "Motor TTS no disponible.");
                                          return;
                                      }
          
                                      Voice chosen = null;
                                      Set<Voice> set = tts.getVoices();
                                      if (set != null && !safeVoice.isEmpty()) {
                                          for (Voice v : set) {
                                              if (safeVoice.equals(v.getName())) {
                                                  chosen = v;
                                                  break;
                                              }
                                          }
                                      }
          
                                      if (chosen != null) tts.setVoice(chosen);
                                      tts.setSpeechRate(safeRate);
                                      tts.setPitch(safePitch);
          
                                      Bundle params = new Bundle();
                                      params.putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, safeVolume);
          
                                      int result = tts.speak(safeText, TextToSpeech.QUEUE_FLUSH, params, safeId);
                                      if (result == TextToSpeech.ERROR) {
                                          dispatchTtsEvent(safeId, "error", "No se pudo iniciar Android TextToSpeech.");
                                      }
                                  } catch (Exception e) {
                                      dispatchTtsEvent(safeId, "error",
                                              e.getMessage() == null ? "error" : e.getMessage());
                                  }
                              }, 80);
                          } catch (Exception e) {
                              dispatchTtsEvent(safeId, "error",
                                      e.getMessage() == null ? "error" : e.getMessage());
                          }
                      });
          
                      return true;
                  }
          
                  @JavascriptInterface
                  public String getClipboardText() {
                      try {
                          ClipboardManager clipboard =
                                  (ClipboardManager) context.getSystemService(Context.CLIPBOARD_SERVICE);
                          if (clipboard == null || !clipboard.hasPrimaryClip()
                                  || clipboard.getPrimaryClip() == null
                                  || clipboard.getPrimaryClip().getItemCount() == 0) {
                              return "";
                          }
                          CharSequence text = clipboard.getPrimaryClip()
                                  .getItemAt(0).coerceToText(context);
                          return text == null ? "" : text.toString();
                      } catch (Exception ignored) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public void hideKeyboard() {
                      runOnUiThread(() -> {
                          try {
                              if (webView != null) {
                                  InputMethodManager imm = (InputMethodManager)
                                          context.getSystemService(Context.INPUT_METHOD_SERVICE);
                                  if (imm != null) {
                                      imm.hideSoftInputFromWindow(webView.getWindowToken(), 0);
                                  }
                                  webView.clearFocus();
                              }
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void stop() {
                      runOnUiThread(() -> {
                          try {
                              mainHandler.removeCallbacksAndMessages(null);
                              if (tts != null) tts.stop();
                          } catch (Exception ignored) {}
                      });
                  }
          
                  @JavascriptInterface
                  public String enginePackage() {
                      try {
                          return tts == null ? "" : String.valueOf(tts.getDefaultEngine());
                      } catch (Exception e) {
                          return "";
                      }
                  }
          
                  void shutdown() {
                      ready = false;
                      try {
                          mainHandler.removeCallbacksAndMessages(null);
                          if (tts != null) {
                              tts.stop();
                              tts.shutdown();
                          }
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF_JAVA

          cat > app/src/main/assets/native-bridge.js <<'EOF_JS'
          (()=>{
            if(window.__DV6_ANDROID_TTS_V54_PATCHED) return;
            window.__DV6_ANDROID_TTS_V54_PATCHED = true;
          
            const nativeBridge = window.DramaVoiceNativeTTS;
            if(!nativeBridge) return;
          
            const nativeCallbacks = new Map();
            let nativeCounter = 0;
            let nativeActiveId = '';
            let nativePaused = false;
          
            function nativeVoiceCatalog(){
              try{
                const raw = nativeBridge.getVoicesJson();
                const list = JSON.parse(raw || '[]');
                if(!Array.isArray(list)) return [];
                return list.map(v=>({
                  name: v.name || 'Android TTS',
                  voiceURI: v.voiceURI || `native:${v.name || 'Android TTS'}`,
                  lang: v.lang || 'und',
                  localService: v.localService !== false,
                  default: !!v.default,
                  nativeBridge: true
                }));
              }catch(e){
                return [];
              }
            }
          
            function isNativeVoice(v){
              return !!v && (v.nativeBridge === true || String(v.voiceURI||'').startsWith('native:'));
            }
          
            function stableVoiceIndex(name,count){
              if(count<=1) return 0;
              let h=2166136261>>>0;
              const s=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
              for(const ch of s){
                h^=ch.charCodeAt(0);
                h=Math.imul(h,16777619)>>>0;
              }
              return h%count;
            }
          
            function androidNarratorVoice(){
              const all = Array.isArray(voices) ? voices : [];
              const es = all.filter(v=>String(v.lang||'').toLowerCase().startsWith('es'));
              return es.find(v=>/^es[-_]?pa\b/i.test(v.lang||'') && v.localService)
                || es.find(v=>/^es[-_]?pa\b/i.test(v.lang||''))
                || es.find(v=>v.default && v.localService)
                || es.find(v=>v.localService)
                || es.find(v=>v.default)
                || es[0]
                || all.find(v=>v.default && v.localService)
                || all.find(v=>v.localService)
                || all.find(v=>v.default)
                || all[0]
                || null;
            }
          
            try{ getNarratorVoice = androidNarratorVoice; }catch(e){}
            try{ getSupertonicVoices = ()=>[]; }catch(e){}
            try{ autoAssignSupertonicVoices = ()=>0; }catch(e){}
            try{ dv6SupertonicSpeakerNumber = ()=>0; }catch(e){}
          
            function narratorVoiceLabelV54(){
              const v=androidNarratorVoice();
              if(!v) return 'Esperando una voz Android disponible';
              return `${v.name} · ${v.lang||'sin idioma'}${v.localService?' · local':''}`;
            }
            try{ narratorVoiceLabel = narratorVoiceLabelV54; }catch(e){}
          
            function autoAssignAndroidVoices(){
              try{
                const native = (Array.isArray(voices)?voices:[]).filter(isNativeVoice);
                const es = native.filter(v=>String(v.lang||'').toLowerCase().startsWith('es'));
                const narrator = androidNarratorVoice();
                const pool0 = es.length ? es : native;
                const pool = pool0.filter(v=>!narrator || (v.voiceURI||v.name)!==(narrator.voiceURI||narrator.name));
                const usable = pool.length ? pool : pool0;
                if(!usable.length) return 0;
          
                let changed=0;
                for(const k of Object.keys(charLib||{})){
                  const ch=charLib[k];
                  if(!ch || (typeof isNarratorName==='function' && isNarratorName(ch.name||k))) continue;
                  const current = typeof getVoice==='function' ? getVoice(ch.voiceURI) : null;
                  if(ch.voiceURI && current) continue;
                  const pick=usable[stableVoiceIndex(ch.name||k,usable.length)];
                  if(pick){
                    ch.voiceURI=pick.voiceURI||pick.name;
                    changed++;
                  }
                }
                if(changed && typeof saveLib==='function') saveLib();
                return changed;
              }catch(e){
                return 0;
              }
            }
          
            function voiceForSpeaker(speaker){
              if(typeof isNarratorName==='function' && isNarratorName(speaker)) return androidNarratorVoice();
              const ch = (typeof characterRecordForName==='function' ? characterRecordForName(speaker) : null) || {};
              return (typeof getVoice==='function' ? getVoice(ch.voiceURI) : null) || androidNarratorVoice();
            }
          
            function nativeParamsForSpeaker(speaker){
              const ch = (typeof characterRecordForName==='function' ? characterRecordForName(speaker) : null) || {};
              const narrator = typeof isNarratorName==='function' && isNarratorName(speaker);
              return {
                voice: voiceForSpeaker(speaker),
                rate: narrator ? .96 : Number(ch.rate || 1),
                pitch: narrator ? .96 : Number(ch.pitch || 1),
                volume: typeof effectiveVoiceVolume==='function' ? effectiveVoiceVolume() : 1
              };
            }
          
            window.dv6NativeTtsEvent = function(id,event,error){
              const cb = nativeCallbacks.get(String(id));
              if(!cb) return;
              if(event === 'start'){
                nativeActiveId = String(id);
                cb.start && cb.start();
                return;
              }
              if(event === 'done'){
                nativeCallbacks.delete(String(id));
                if(nativeActiveId === String(id)) nativeActiveId = '';
                cb.done && cb.done();
                return;
              }
              if(event === 'stop'){
                nativeCallbacks.delete(String(id));
                if(nativeActiveId === String(id)) nativeActiveId = '';
                cb.stop && cb.stop();
                return;
              }
              if(event === 'error'){
                nativeCallbacks.delete(String(id));
                if(nativeActiveId === String(id)) nativeActiveId = '';
                cb.error && cb.error(error || 'error');
              }
            };
          
            function nativeSpeak(text,speaker,callbacks={}){
              const p = nativeParamsForSpeaker(speaker);
              if(!isNativeVoice(p.voice)) return false;
              const id = 'dv6-'+Date.now()+'-'+(++nativeCounter);
              nativeCallbacks.set(id, callbacks);
              nativeActiveId = id;
              nativePaused = false;
              try{
                const ok = nativeBridge.speak(
                  String(text||''),
                  String(p.voice.name||''),
                  Number(p.rate||1),
                  Number(p.pitch||1),
                  Number(p.volume||1),
                  id
                );
                if(!ok){
                  nativeCallbacks.delete(id);
                  nativeActiveId='';
                  callbacks.error && callbacks.error('Android TTS no pudo iniciar la voz.');
                  return false;
                }
                return true;
              }catch(e){
                nativeCallbacks.delete(id);
                nativeActiveId='';
                callbacks.error && callbacks.error(String(e && e.message || e));
                return false;
              }
            }
          
            function nativeStop(){
              if(nativeActiveId){
                nativeCallbacks.delete(String(nativeActiveId));
                nativeActiveId='';
              }
              try{ nativeBridge.stop(); }catch(e){}
            }
          
            function nativeReady(){
              try{return !!nativeBridge.isReady();}catch(e){return false}
            }
          
            function engineLabel(){
              try{
                const p=String(nativeBridge.enginePackage()||'').trim();
                return p || 'motor predeterminado';
              }catch(e){
                return 'motor predeterminado';
              }
            }
          
            const webConfigureUtterance = typeof configureUtterance==='function' ? configureUtterance : null;
            configureUtterance = function(u,speaker){
              const p = nativeParamsForSpeaker(speaker);
              if(isNativeVoice(p.voice)){
                u._dv6NativeVoice = p.voice;
                u.rate = p.rate;
                u.pitch = p.pitch;
                u.volume = p.volume;
                return;
              }
              if(webConfigureUtterance) return webConfigureUtterance(u,speaker);
            };
          
            loadVoices = function(){
              const nativeVoices = nativeVoiceCatalog();
              const webVoices = ('speechSynthesis' in window) ? (speechSynthesis.getVoices() || []) : [];
              const seen = new Set();
          
              voices = [...nativeVoices, ...webVoices].filter(v=>{
                const k = `${v.voiceURI||v.name}|${v.lang||''}`;
                if(seen.has(k)) return false;
                seen.add(k);
                return true;
              });
          
              const assigned = autoAssignAndroidVoices();
              const f = document.querySelector('#langFilter')?.value || '';
              const shown = voices.filter(v=>!f || String(v.lang||'').toLowerCase().startsWith(f));
              const es = voices.filter(v=>String(v.lang||'').toLowerCase().startsWith('es'));
              const nativeEs = nativeVoices.filter(v=>String(v.lang||'').toLowerCase().startsWith('es'));
              const local = nativeVoices.filter(v=>v.localService);
          
              const vc=document.querySelector('#voiceCount');
              if(vc) vc.textContent=`${shown.length} voces`;
          
              const support=document.querySelector('#ttsSupport');
              const summary=document.querySelector('#settingsVoiceSummary');
          
              if(nativeVoices.length){
                const extra=assigned?` · ${assigned} personaje${assigned===1?'':'s'} reasignado${assigned===1?'':'s'}`:'';
                if(support){
                  support.textContent=`Android TTS conectado · ${nativeVoices.length} voces nativas · ${nativeEs.length} en español · ${engineLabel()}${extra}.`;
                  support.className='status good';
                }
                if(summary) summary.textContent=`Android TTS · ${nativeVoices.length} voces`;
              }else{
                if(support){
                  support.textContent=nativeReady()
                    ? `Android TTS está activo, pero todavía no entregó el catálogo de voces.`
                    : `Inicializando Android TextToSpeech…`;
                  support.className='status warn';
                }
                if(summary) summary.textContent='Android TTS · inicializando';
              }
          
              const nativeLines=nativeVoices.slice(0,30).map(v=>`• ${v.name} (${v.lang})${v.localService?' · local':' · red'}`).join('\n');
              const diag=`Total: ${voices.length} · Android nativo: ${nativeVoices.length} · Español: ${es.length} · Locales Android: ${local.length} · Chrome/WebView: ${webVoices.length}\nMotor: ${engineLabel()}${nativeLines?'\n'+nativeLines:''}`;
              const vd=document.querySelector('#voiceDiagnostics');
              if(vd) vd.textContent=diag;
              const dp=document.querySelector('#diagnosticPanel');
              if(dp) dp.textContent='Diagnóstico TTS\n'+diag;
              const nvi=document.querySelector('#narratorVoiceInfo');
              if(nvi) nvi.textContent=narratorVoiceLabelV54();
          
              try{ if(typeof renderCast==='function') renderCast(); }catch(e){}
              try{ if(typeof renderPronRules==='function') renderPronRules(); }catch(e){}
            };
          
            refreshVoicesManual = async function(){
              const btn=document.querySelector('#refreshVoicesBtn');
              const feedback=document.querySelector('#voiceRefreshFeedback');
              if(!btn || btn.disabled) return;
          
              let before='';
              try{before=nativeBridge.getVoicesJson()||''}catch(e){}
              btn.disabled=true;
              btn.classList.add('checking');
              btn.textContent='⟳ Comprobando…';
              if(feedback){
                feedback.textContent='Consultando directamente Android TextToSpeech…';
                feedback.className='voice-refresh-feedback warn';
              }
              try{if(navigator.vibrate)navigator.vibrate(18)}catch(e){}
          
              loadVoices();
              await new Promise(r=>setTimeout(r,300));
              loadVoices();
              await new Promise(r=>setTimeout(r,700));
              loadVoices();
          
              let after='';
              try{after=nativeBridge.getVoicesJson()||''}catch(e){}
              const nativeCount=nativeVoiceCatalog().length;
              const changed=before!==after;
              const clock=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
          
              if(feedback){
                feedback.textContent=`Comprobación ${clock}: ${nativeCount} voces Android${changed?' · catálogo actualizado':' · sin cambios'}.`;
                feedback.className=nativeCount?'voice-refresh-feedback good':'voice-refresh-feedback warn';
              }
              btn.textContent=nativeCount?`✓ ${nativeCount} voces Android`:'✓ Sin voces disponibles';
              setTimeout(()=>{
                if(btn){
                  btn.disabled=false;
                  btn.classList.remove('checking');
                  btn.textContent='Actualizar voces';
                }
              },1700);
            };
          
            const webSpeakOne = typeof speakOne==='function' ? speakOne : null;
            speakOne = function(ev,advance=true){
              const p = nativeParamsForSpeaker(ev.speaker);
              if(!isNativeVoice(p.voice)){
                if(webSpeakOne) return webSpeakOne(ev,advance);
                return;
              }
          
              clearTimeout(interruptTimer);
              const token=++speechToken;
              try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
              nativeStop();
          
              const text=typeof applyPronunciationRules==='function'
                ? applyPronunciationRules(ev.text,ev.speaker)
                : String(ev.text||'');
          
              let cutByInterrupt=false;
          
              nativeSpeak(text,ev.speaker,{
                start:()=>{
                  if(token!==speechToken)return;
                  playing=true;
                  paused=false;
                  nativePaused=false;
                  if(typeof setAmbientDucking==='function')setAmbientDucking(true);
                  const sl=document.querySelector('#stateLabel');
                  if(sl)sl.textContent='reproduciendo';
          
                  const ps=document.querySelector('#playerStatus');
                  if(ev.mode==='overlap' && ps){
                    ps.textContent='Solapamiento marcado. Android TTS reproduce esta intervención dentro de DramaVoice.';
                    ps.className='status warn';
                  }else if(ps){
                    ps.textContent='';
                    ps.className='status';
                  }
          
                  const next=queue[queueIndex+1];
                  if(advance && next?.type==='speech' && next.mode==='interrupt'){
                    const ms=estimateSpeechMs(ev.text,ev.speaker);
                    const lead=Math.min(1400,Math.max(500,ms*.22));
                    interruptTimer=setTimeout(()=>{
                      if(!playing || token!==speechToken)return;
                      cutByInterrupt=true;
                      speechToken++;
                      nativeStop();
                      if(queueIndex<queue.length-1){
                        queueIndex++;
                        const ps2=document.querySelector('#playerStatus');
                        if(ps2){
                          ps2.textContent=`${displayName(next.speaker)} interrumpe la intervención anterior.`;
                          ps2.className='status warn';
                        }
                        playCurrent();
                      }
                    },Math.max(500,ms-lead));
                  }
                  updatePlayer();
                },
                done:()=>{
                  clearTimeout(interruptTimer);
                  if(typeof setAmbientDucking==='function')setAmbientDucking(false);
                  if(token!==speechToken || cutByInterrupt)return;
                  if(advance && playing)nextAuto();
                },
                stop:()=>{
                  clearTimeout(interruptTimer);
                  if(typeof setAmbientDucking==='function')setAmbientDucking(false);
                },
                error:(err)=>{
                  clearTimeout(interruptTimer);
                  if(typeof setAmbientDucking==='function')setAmbientDucking(false);
                  if(token!==speechToken || cutByInterrupt || previewing)return;
                  const ps=document.querySelector('#playerStatus');
                  if(ps){
                    ps.textContent='La voz Android no pudo reproducirse: '+(err||'error');
                    ps.className='status bad';
                  }
                  if(advance && playing)nextAuto();
                }
              });
            };
          
            const webPreviewVoice = typeof previewVoice==='function' ? previewVoice : null;
            previewVoice = function(name,text,statusEl){
              const p=nativeParamsForSpeaker(name);
              if(!isNativeVoice(p.voice)){
                if(webPreviewVoice)return webPreviewVoice(name,text,statusEl);
                return;
              }
              if(playing || paused){
                statusEl.textContent='Detén la escena para probar una voz sin alterar la reproducción.';
                statusEl.style.color='var(--warn)';
                return;
              }
          
              const token=++dv6PreviewToken;
              previewing=true;
              nativeStop();
          
              const phrase=typeof applyPronunciationRules==='function'
                ? applyPronunciationRules(text||'Prueba de voz',name)
                : String(text||'Prueba de voz');
          
              statusEl.textContent=`Preparando prueba con ${p.voice.name}…`;
              statusEl.style.color='var(--warn)';
          
              const done=(msg,color='')=>{
                if(token!==dv6PreviewToken)return;
                previewing=false;
                statusEl.textContent=msg;
                if(color)statusEl.style.color=color;
              };
          
              nativeSpeak(phrase,name,{
                start:()=>{if(token===dv6PreviewToken){statusEl.textContent=`Probando ${p.voice.name}…`;statusEl.style.color='var(--aqua)'}},
                done:()=>done('Prueba terminada.','var(--aqua)'),
                stop:()=>done('Prueba detenida.','var(--warn)'),
                error:e=>done(`No se pudo reproducir la prueba: ${e||'error'}.`,'var(--warn)')
              });
            };
          
            const webPreviewPersonalPronunciation =
              typeof previewPersonalPronunciation==='function' ? previewPersonalPronunciation : null;
          
            previewPersonalPronunciation = function(characterKey,row){
              const ch=charLib[characterKey];
              if(!ch)return;
              const p=nativeParamsForSpeaker(ch.name||characterKey);
              if(!isNativeVoice(p.voice)){
                if(webPreviewPersonalPronunciation)return webPreviewPersonalPronunciation(characterKey,row);
                return;
              }
          
              const btn=row.querySelector('.character-pron-test');
              const feedback=row.closest('.character-pron-box')?.querySelector('.character-pron-feedback');
              const to=row.querySelector('.cpTo')?.value.trim()||'';
          
              const setFeedback=(msg,kind='')=>{
                if(!feedback)return;
                feedback.textContent=msg;
                feedback.className='prompt-status character-pron-feedback'+(kind?` ${kind}`:'');
              };
          
              if(!to){setFeedback('Escribe primero cómo debe pronunciarse.','warn');return}
              if(playing||paused){setFeedback('Detén la escena antes de probar esta pronunciación.','warn');return}
          
              const token=++dv6PreviewToken;
              previewing=true;
              nativeStop();
              if(btn){btn.textContent='■';btn.disabled=true}
              setFeedback(`Preparando prueba con ${p.voice.name}…`,'warn');
          
              const done=(msg,kind='')=>{
                if(token!==dv6PreviewToken)return;
                previewing=false;
                if(btn){btn.textContent='▶';btn.disabled=false}
                setFeedback(msg,kind);
              };
          
              nativeSpeak(to,ch.name||characterKey,{
                start:()=>{if(token===dv6PreviewToken)setFeedback(`Reproduciendo: “${to}”`,'good')},
                done:()=>done('Prueba terminada.','good'),
                stop:()=>done('Prueba detenida.','warn'),
                error:e=>done(`No se pudo reproducir la pronunciación: ${e||'error'}.`,'warn')
              });
            };
          
            const webStopSpeechOnly = typeof stopSpeechOnly==='function' ? stopSpeechOnly : null;
            stopSpeechOnly = function(){
              clearTimeout(interruptTimer);
              speechToken++;
              if(typeof setAmbientDucking==='function')setAmbientDucking(false);
              try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
              nativeStop();
              nativeActiveId='';
            };
          
            const playBtn=document.querySelector('#playBtn');
            const pauseBtn=document.querySelector('#pauseBtn');
            const oldPlayHandler=playBtn?.onclick;
            const oldPauseHandler=pauseBtn?.onclick;
          
            if(playBtn)playBtn.onclick=()=>{
              if(paused && nativePaused){
                paused=false;
                playing=true;
                nativePaused=false;
                timelineEventStartedAt=Date.now();
                startTimelineClock();
                const sl=document.querySelector('#stateLabel');
                if(sl)sl.textContent='reproduciendo';
                ensureWakeLock();
                updatePlayerPortrait();
                const e=queue[queueIndex];
                if(e?.type==='speech')speakOne(e,true);else playCurrent();
                return;
              }
              if(oldPlayHandler)oldPlayHandler();
            };
          
            if(pauseBtn)pauseBtn.onclick=()=>{
              if(nativeActiveId && playing && !paused){
                nativePaused=true;
                nativeStop();
                pauseTimelineClock();
                paused=true;
                releaseWakeLock();
                const sl=document.querySelector('#stateLabel');
                if(sl)sl.textContent='pausado';
                updatePlayerPortrait();
                return;
              }
              if(oldPauseHandler)oldPauseHandler();
            };
          
            try{
              if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=loadVoices;
            }catch(e){}
          
            const refresh=document.querySelector('#refreshVoicesBtn');
            if(refresh)refresh.onclick=refreshVoicesManual;
          
            const sub=document.querySelector('.brand .sub');
            if(sub)sub.textContent='v55 · Android TTS nativo';
          
            const versionLine=document.querySelector('.dv6-version-current');
            if(versionLine)versionLine.textContent='Versión instalada: v55 Android TTS';
          
            const installBtn=document.querySelector('#installPwaBtn');
            if(installBtn)installBtn.style.display='none';
          
            const installedBadge=document.querySelector('#pwaInstalledBadge');
            if(installedBadge){
              installedBadge.style.display='inline-flex';
              installedBadge.textContent='✓ App Android';
            }
          
            loadVoices();
            setTimeout(loadVoices,400);
            setTimeout(loadVoices,1200);
          })();
          EOF_JS

          if [ -f icon-192.png ]; then
            cp icon-192.png app/src/main/res/drawable/dv6_icon.png
          else
            curl -L --fail --retry 4 \
              "https://raw.githubusercontent.com/camilojavier86-lab/DramaVoice6/main/icon-192.png" \
              -o app/src/main/res/drawable/dv6_icon.png
          fi

