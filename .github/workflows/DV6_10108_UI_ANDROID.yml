          grep -q 'Set<Voice> voiceSet = tts.getVoices()' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'Android TTS conectado' app/src/main/assets/native-bridge.js
          grep -q 'FrameLayout root = new FrameLayout(this);' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'getSystemWindowInsetTop()' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'public String getClipboardText()' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'public void hideKeyboard()' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          if grep -Rni 'SUPERTONIC_ENGINE\|com.dramavoice6.supertonic\|DV6 Supertonic' app/src/main; then
            echo "ERROR: todavía existe una dependencia Supertonic en v55."
            exit 1
          fi
          echo "OK: v55 usa Android TextToSpeech predeterminado y catálogo real de voces."

