name: Actualizar DramaVoice 6 v50 barras y voces

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DramaVoice6_v50_BARRAS_Y_VOCES.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar DramaVoice 6 v50
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/dv50_patch.py
          python3 /tmp/dv50_patch.py

      - name: Guardar actualización
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          git commit -m "DramaVoice 6 v50: barras fijas y audio Supertonic"
          git push
