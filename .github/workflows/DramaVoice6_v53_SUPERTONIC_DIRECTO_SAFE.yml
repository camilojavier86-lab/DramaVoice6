name: Build DramaVoice 6 v53 Supertonic Directo SAFE

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DramaVoice6_v53_SUPERTONIC_DIRECTO_SAFE.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone sherpa-onnx v1.13.8
        run: git clone --depth 1 --branch v1.13.8 https://github.com/k2-fsa/sherpa-onnx.git sherpa-onnx

      - name: Download official Supertonic package
        run: |
          curl -L --fail --retry 5 "https://huggingface.co/csukuangfj2/sherpa-onnx-apk/resolve/main/tts-engine-new/1.13.8/sherpa-onnx-1.13.8-arm64-v8a-eng-tts-engine-sherpa-onnx-supertonic-3-tts-int8-2026-05-11.apk?download=true" -o official-supertonic.apk
          rm -rf official-apk
          mkdir -p official-apk
          unzip -q official-supertonic.apk -d official-apk
          test -d official-apk/assets
          test -d official-apk/lib/arm64-v8a

      - name: Create integrated DramaVoice project
        run: |
          set -e
          mkdir -p app/src/main/java/com/dramavoice6/integratedsafe
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # More heap and fewer workers: the embedded Supertonic models are large.
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            'org.gradle.workers.max=2' \
            'org.gradle.parallel=false' > gradle.properties

          echo '' | base64 --decode > settings.gradle.kts
          echo 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMi4wLjIxIiBhcHBseSBmYWxzZQp9Cg==' | base64 --decode > build.gradle.kts
          echo '' | base64 --decode > app/build.gradle.kts
          printf '%s\n' '' 'android {' '    androidResources {' '        noCompress += listOf("onnx", "bin", "json")' '    }' '}' >> app/build.gradle.kts
          echo '' | base64 --decode > app/src/main/AndroidManifest.xml
          echo '' | base64 --decode > app/src/main/res/values/styles.xml
          echo '' | base64 --decode > app/src/main/java/com/dramavoice6/integratedsafe/MainActivity.kt
          echo '' | base64 --decode > app/src/main/assets/native-bridge.js

          cp sherpa-onnx/android/SherpaOnnxTts/app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt
          cp -a official-apk/assets/. app/src/main/assets/
          cp -a official-apk/lib/arm64-v8a/. app/src/main/jniLibs/arm64-v8a/

          curl -L --fail --retry 4 "https://raw.githubusercontent.com/camilojavier86-lab/DramaVoice6/main/icon-192.png" -o app/src/main/res/drawable/dv6_icon.png

          test -f app/src/main/assets/sherpa-onnx-supertonic-3-tts-int8-2026-05-11/duration_predictor.int8.onnx
          test -f app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so

      - name: Validate generated source
        run: |
          set -e
          grep -q 'applicationId = "com.dramavoice6.integratedsafe"' app/build.gradle.kts
          grep -q 'isSupertonic = true' app/src/main/java/com/dramavoice6/integratedsafe/MainActivity.kt
          grep -q 'supertonicVocoder = "vocoder.int8.onnx"' app/src/main/java/com/dramavoice6/integratedsafe/MainActivity.kt
          grep -q 'private var track: AudioTrack? = null' app/src/main/java/com/dramavoice6/integratedsafe/MainActivity.kt
          grep -q 'localTrack.pause()' app/src/main/java/com/dramavoice6/integratedsafe/MainActivity.kt
          grep -q 'localTrack.flush()' app/src/main/java/com/dramavoice6/integratedsafe/MainActivity.kt
          if grep -q 'cancelTrackOnly' app/src/main/java/com/dramavoice6/integratedsafe/MainActivity.kt; then
            echo "ERROR: v52 AudioTrack release pattern is still present"
            exit 1
          fi
          grep -q 'Supertonic directo SAFE' app/src/main/assets/native-bridge.js

      - name: Install Gradle 8.9
        run: |
          curl -L --fail --retry 4 "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -o gradle.zip
          unzip -q gradle.zip

      - name: Build integrated APK
        run: |
          set -e
          ./gradle-8.9/bin/gradle --no-daemon :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk DramaVoice6-v53-Supertonic-Directo-SAFE.apk
          ls -lh DramaVoice6-v53-Supertonic-Directo-SAFE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DramaVoice6-v53-Supertonic-Directo-SAFE
          path: DramaVoice6-v53-Supertonic-Directo-SAFE.apk
          if-no-files-found: error
