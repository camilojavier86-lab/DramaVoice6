name: DramaVoice 6 v1.1.1 - Reproductor nocturno y narrador configurable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar DramaVoice v1.1.1
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re

          INDEX=Path("index.html")
          VERSION=Path("version.json")
          SW=Path("service-worker.js")

          for p in (INDEX,VERSION,SW):
              if not p.exists():
                  raise SystemExit(f"ERROR: falta {p}")

          html=INDEX.read_text(encoding="utf-8")

          js_patch=base64.b64decode("").decode("utf-8")
          Path("dv111_patch_check.js").write_text(js_patch,encoding="utf-8")

          patch='<script id="dv6-v111-player-night-patch">\n'+js_patch+'\n</script>'
          rx=r'<script id="dv6-v111-player-night-patch">.*?</script>'
          if re.search(rx,html,re.S):
              html=re.sub(rx,lambda m:patch,html,count=1,flags=re.S)
          else:
              if "</body>" not in html:
                  raise SystemExit("ERROR: index.html no contiene </body>.")
              html=html.replace("</body>",patch+"\n</body>",1)

          html,n=re.subn(
              r'<meta name="dv6-version" content="[^"]*">',
              '<meta name="dv6-version" content="10102">',
              html,count=1
          )
          if n!=1:
              raise SystemExit("ERROR: no se pudo actualizar meta dv6-version.")

          html,n=re.subn(
              r'const\s+DV6_APP_VERSION\s*=\s*\d+\s*;',
              'const DV6_APP_VERSION=10102;',
              html,count=1
          )
          if n!=1:
              raise SystemExit("ERROR: no se pudo actualizar DV6_APP_VERSION.")

          # Mantener sincronizadas las capas de actualización ya existentes.
          html=re.sub(r"const\s+DV110_VERSION\s*=\s*\d+\s*;", "const DV110_VERSION=10102;", html, count=1)
          html=re.sub(r"const\s+DV110_DISPLAY\s*=\s*'[^']*'\s*;", "const DV110_DISPLAY='1.1.1';", html, count=1)
          html=re.sub(r"const\s+DV110_BUILD\s*=\s*'[^']*'\s*;", "const DV110_BUILD='2026.09.28-10102';", html, count=1)
          html=re.sub(r"const\s+DV105_VERSION\s*=\s*\d+\s*;", "const DV105_VERSION=10102;", html, count=1)
          html=re.sub(r"const\s+DV105_BUILD\s*=\s*'[^']*'\s*;", "const DV105_BUILD='2026.09.28-10102';", html, count=1)

          html=re.sub(
              r'<title>DramaVoice 6[^<]*</title>',
              '<title>DramaVoice 6 v1.1.1</title>',
              html,count=1
          )

          INDEX.write_text(html,encoding="utf-8")

          VERSION.write_text(json.dumps({
              "version":10102,
              "displayVersion":"1.1.1",
              "build":"2026.09.28-10102",
              "date":"28 sep 2026",
              "title":"Reproductor nocturno y narrador configurable",
              "updateRequired":False,
              "changes":[
                  "Reduce brillos y resplandores fuertes del reproductor para uso nocturno.",
                  "Conserva el color distintivo de DramaVoice como marca de agua tenue en lugar de un bloque luminoso.",
                  "Suaviza el paso entre las imágenes de los personajes mediante transición gradual.",
                  "Muestra debajo del hablante qué cara o expresión está usando el personaje.",
                  "Añade una animación central tenue que cambia de comportamiento según voz, ambiente, efectos y cambios de lugar.",
                  "Permite asignar una cara al narrador desde Personajes, fuera del reproductor.",
                  "Permite cambiar y probar la voz del narrador desde Personajes; el reproductor utiliza la selección guardada.",
                  "Conserva Android TTS nativo, escenas, sonidos, personajes y datos locales."
              ]
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          sw=SW.read_text(encoding="utf-8")
          sw,n=re.subn(
              r"const\s+DV6_SW_VERSION\s*=\s*['\"][^'\"]+['\"]\s*;",
              "const DV6_SW_VERSION='1.1.1-10102';",
              sw,count=1
          )
          if n!=1:
              raise SystemExit("ERROR: no se pudo actualizar DV6_SW_VERSION.")
          SW.write_text(sw,encoding="utf-8")

          print("DramaVoice v1.1.1 preparada.")
          PY

      - name: Validar v1.1.1
        shell: bash
        run: |
          set -e

          node --check dv111_patch_check.js
          rm -f dv111_patch_check.js

          grep -q "__DV6_V111_PLAYER_NIGHT" index.html
          grep -q 'id="dv6-v111-player-night-patch"' index.html
          grep -q "DV6_APP_VERSION=10102;" index.html
          grep -q "DV110_DISPLAY='1.1.1';" index.html
          grep -q "DV110_BUILD='2026.09.28-10102';" index.html
          grep -q "Cara del narrador" index.html
          grep -q "Voz del narrador" index.html
          grep -q "dv111-sound-field" index.html
          grep -q "transitionImage" index.html
          grep -q '"displayVersion": "1.1.1"' version.json
          grep -q '"build": "2026.09.28-10102"' version.json
          grep -q "DV6_SW_VERSION='1.1.1-10102'" service-worker.js

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html service-worker.js version.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "ERROR: se modificaron archivos inesperados:"
            echo "$changed"
            exit 1
          fi

          git diff --check
          echo "OK: v1.1.1 validada. Es actualización web; no genera APK."

      - name: Publicar v1.1.1
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html version.json service-worker.js

          if git diff --cached --quiet; then
            echo "La v1.1.1 ya estaba aplicada."
            exit 0
          fi

          git commit -m "DramaVoice 6 v1.1.1: reproductor nocturno y narrador configurable"
          git push
