name: DramaVoice 6 v1.1.1 - Voces ES/US y rendimiento build10105

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar base exacta 10104
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "cc88f4281afa20a9cc001dc95e39964fd2ab99cd"
          test "$(git hash-object version.json)" = "4a5e1d82546d088b6ba4783714f24a600c5af2e8"
          test "$(git hash-object service-worker.js)" = "4cc2d88ffd6ff84fceca4544e2273120b12edf76"
          echo "OK: base 10104 exacta."

      - name: Aplicar build10105
        shell: bash
        env:
          DV6_OPS_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY_PATCH'
          from pathlib import Path
          import os,base64,gzip,json

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          lines=text.splitlines(keepends=True)
          ops=json.loads(gzip.decompress(base64.b64decode(os.environ['DV6_OPS_B64'])).decode('utf-8'))
          for i1,i2,new_text in reversed(ops):
              lines[i1:i2]=new_text.splitlines(keepends=True)
          path.write_text(''.join(lines),encoding='utf-8')
          PY_PATCH

          cat > version.json <<'EOF_VERSION'
          {
            "version": 10105,
            "displayVersion": "1.1.1",
            "build": "2026.10.04-10105",
            "date": "4 oct 2026",
            "title": "Voces Android España + EE. UU. y rendimiento",
            "updateRequired": false,
            "changes": [
              "DramaVoice separa las voces Android TTS de Español (España) y Español (Estados Unidos) y permite asignarlas individualmente a cada personaje.",
              "Conserva la voz nativa elegida por el usuario y evita que la autoasignación la sustituya al recargar el catálogo.",
              "Muestra cuántas voces es-ES y es-US entrega realmente Android dentro de la app.",
              "Evita que parches antiguos de Supertonic o fallbacks web se monten encima del puente Android TTS v54.",
              "Reduce observadores globales, renders repetidos y consultas duplicadas a la biblioteca de sonidos para mejorar la fluidez del reproductor.",
              "Mantiene intactas las protecciones de importación y almacenamiento de build 10104.",
              "Actualización exclusivamente web: no cambia el APK, la firma ni los datos locales."
            ]
          }
          EOF_VERSION

          sed -i "s/1\.1\.1-10104/1.1.1-10105/" service-worker.js

      - name: Validar HTML, voces y protecciones
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "367a3fb9fe935e6e885dbb34841b1158468e3364"
          test "$(git hash-object version.json)" = "69f09aa3db9fcdcd7b1547fdb65eccc0b888b84f"
          test "$(git hash-object service-worker.js)" = "9c9f03a3259ef2f0685084bb0323c3eb695c32b7"

          grep -q '<meta name="dv6-version" content="10105">' index.html
          grep -q 'const DV6_APP_VERSION=10105;' index.html
          grep -q 'Español (España)' index.html
          grep -q 'Español (Estados Unidos)' index.html
          grep -q '__DV6_ANDROID_TTS_V54_PATCHED' index.html
          grep -q 'dv6SoundStorageFailureUntil' index.html
          grep -q 'dv6PhotoStorageFailureUntil' index.html
          grep -q 'dv6PlacePhotoStorageFailureUntil' index.html
          grep -q 'showImportProgress=async(label,current,total)' index.html
          ! grep -q 'name="dv6-lab"' index.html
          ! grep -q 'observer.observe(document.body,{childList:true,subtree:true,characterData:true})' index.html

          python - <<'PY_JS'
          from pathlib import Path
          import re,subprocess,tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
              if 'src=' in m.group(0).split('>')[0].lower():
                  continue
              body=m.group(1)
              if body.strip(): blocks.append(body)
          assert len(blocks)>=10, f'Esperaba al menos 10 scripts; encontré {len(blocks)}'
          with tempfile.TemporaryDirectory() as d:
              for i,body in enumerate(blocks,1):
                  p=Path(d)/f'{i:02d}.js'; p.write_text(body,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
          print(f'OK: {len(blocks)} bloques JavaScript válidos.')
          PY_JS

          python -m json.tool version.json >/dev/null
          node --check service-worker.js
          git diff --check
          echo "OK: build10105 validado."

      - name: Publicar build10105
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          git commit -m "DramaVoice 6 v1.1.1 build10105: voces ES-US y rendimiento"
          git push
