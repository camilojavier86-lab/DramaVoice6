name: Actualizar DramaVoice 6 v1.0.3 - Voz Android fallback

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DramaVoice6_v1_0_3_VOZ_ANDROID_FALLBACK.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar v1.0.3
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json
          import re

          index = Path("index.html")
          if not index.exists():
              raise RuntimeError("No existe index.html en la raíz del repositorio.")

          text = index.read_text(encoding="utf-8")

          # A) Consolidar la corrección de respaldo pendiente.
          if "const shareFile=dvPreparedProjectBackup.shareFile||file;" not in text:
              old = "   const file=dvPreparedProjectBackup.file;\\n"
              if old not in text:
                  raise RuntimeError("No se encontró el punto seguro para activar shareFile.")
              text = text.replace(
                  old,
                  old + "   const shareFile=dvPreparedProjectBackup.shareFile||file;\\n",
                  1
              )

          text = text.replace(
              "navigator.canShare({files:[file]})",
              "navigator.canShare({files:[shareFile]})",
              1
          )
          text = text.replace(
              "         files:[file],",
              "         files:[shareFile],",
              1
          )

          if "DramaVoice6_Respaldo_${day}_v1.0.3.txt" not in text:
              marker = "   dvPreparedProjectBackup={\\n     file,\\n"
              marker2 = "   dvPreparedProjectBackup={\\n     file,\\n     shareFile,\\n"
              if marker in text:
                  share_code = (
                      "   const shareFile=new File(\\n"
                      "     [await file.text()],\\n"
                      "     `DramaVoice6_Respaldo_${day}_v1.0.3.txt`,\\n"
                      "     {type:'text/plain'}\\n"
                      "   );\\n\\n"
                  )
                  replacement = "   dvPreparedProjectBackup={\\n     file,\\n     shareFile,\\n"
                  text = text.replace(marker, share_code + replacement, 1)
              elif marker2 not in text:
                  raise RuntimeError("No se encontró dvPreparedProjectBackup para consolidar el respaldo.")

          text = re.sub(
              r"`DramaVoice6_Respaldo_\$\{day\}_v1\.0\.[12]\.txt`",
              "`DramaVoice6_Respaldo_${day}_v1.0.3.txt`",
              text,
              count=1
          )
          text = re.sub(
              r"`DramaVoice6_Respaldo_\$\{day\}_v1\.0\.[12]\.json`",
              "`DramaVoice6_Respaldo_${day}_v1.0.3.json`",
              text,
              count=1
          )
          text = re.sub(
              r"version:'1\.0\.[12]'",
              "version:'1.0.3'",
              text,
              count=1
          )

          m = re.search(r'<input\b[^>]*\bid=["\\\']importProjectInput["\\\'][^>]*>', text, flags=re.I)
          if m:
              tag = m.group(0)
              desired = 'accept=".json,.txt,application/json,text/plain"'
              if desired not in tag:
                  if re.search(r'\baccept=["\\\'][^"\\\']*["\\\']', tag, flags=re.I):
                      new_tag = re.sub(
                          r'\baccept=["\\\'][^"\\\']*["\\\']',
                          desired,
                          tag,
                          count=1,
                          flags=re.I
                      )
                  else:
                      new_tag = tag[:-1] + ' ' + desired + '>'
                  text = text[:m.start()] + new_tag + text[m.end():]

          # B) Añadir fallback TTS sin cambiar APK.
          fallback_script = base64.b64decode("").decode("utf-8")
          if 'id="dv103-system-tts-fallback"' not in text:
              if "</body>" not in text:
                  raise RuntimeError("No se encontró </body> para insertar el fallback TTS.")
              text = text.replace("</body>", fallback_script + "\\n</body>", 1)

          # C) Numeración formal v1.0.3.
          text, n1 = re.subn(
              r"const DV6_APP_VERSION=\d+;",
              "const DV6_APP_VERSION=10003;",
              text,
              count=1
          )
          if n1 != 1:
              raise RuntimeError("No se encontró DV6_APP_VERSION una sola vez.")

          text, n2 = re.subn(
              r'<meta name="dv6-version" content="\d+">',
              '<meta name="dv6-version" content="10003">',
              text,
              count=1
          )
          if n2 != 1:
              raise RuntimeError("No se encontró meta dv6-version una sola vez.")

          text = re.sub(
              r'Versión instalada: v[^<\n]+',
              'Versión instalada: v1.0.3',
              text,
              count=1
          )

          index.write_text(text, encoding="utf-8")

          version = {
              "version": 10003,
              "displayVersion": "1.0.3",
              "build": "2026.09.27.10003",
              "date": "27 sep 2026",
              "title": "Voz Android predeterminada de respaldo",
              "updateRequired": False,
              "changes": [
                  "Consolida la corrección de exportación pendiente de v1.0.2.",
                  "Si Android/Chrome no enumera ninguna voz, DramaVoice muestra una voz de respaldo llamada Android predeterminada.",
                  "La voz de respaldo deja que el sistema TTS del teléfono escoja su voz y motor predeterminados.",
                  "Si el catálogo real de voces aparece después, reemplaza automáticamente el fallback.",
                  "No se genera ni reemplaza el APK y no se modifican los datos locales."
              ]
          }
          Path("version.json").write_text(
              json.dumps(version, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8"
          )

          sw = Path("service-worker.js")
          sw_text = sw.read_text(encoding="utf-8")
          sw_text, n3 = re.subn(
              r"const DV6_SW_VERSION='[^']+';",
              "const DV6_SW_VERSION='1.0.3';",
              sw_text,
              count=1
          )
          if n3 != 1:
              raise RuntimeError("No se encontró DV6_SW_VERSION una sola vez.")
          sw.write_text(sw_text, encoding="utf-8")

          final = index.read_text(encoding="utf-8")
          required = [
              "const DV6_APP_VERSION=10003;",
              'id="dv103-system-tts-fallback"',
              "Android predeterminada",
              "dv6-system-default",
              "Android TTS listo",
              "const shareFile=dvPreparedProjectBackup.shareFile||file;",
              "navigator.canShare({files:[shareFile]})",
              "files:[shareFile]"
          ]
          for token in required:
              if token not in final:
                  raise RuntimeError("Validación falló: " + token)

          if "dv110-script" in final:
              raise RuntimeError("Se detectó el parche v1.1.0 defectuoso; abortando por seguridad.")

          print("DramaVoice 6 v1.0.3 validada.")

          PY

      - name: Validar archivos finales
        shell: bash
        run: |
          set -e
          grep -q 'const DV6_APP_VERSION=10003;' index.html
          grep -q 'dv103-system-tts-fallback' index.html
          grep -q 'Android predeterminada' index.html
          grep -q 'dv6-system-default' index.html
          grep -q '"displayVersion": "1.0.3"' version.json
          grep -q "DV6_SW_VERSION='1.0.3'" service-worker.js

      - name: Guardar actualización
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi

          git commit -m "DramaVoice 6 v1.0.3: voz Android predeterminada"
          git push
