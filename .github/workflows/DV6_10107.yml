name: DramaVoice 6 v1.1.1 - Biblioteca escalable build10107

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar base exacta 10106
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "45472725803b6c7b5a1a622d3cb356c5d0ab213b"
          test "$(git hash-object version.json)" = "0a7a7f0d15eb27d6d355c2dd34e5abee09995876"
          test "$(git hash-object service-worker.js)" = "c5c74481ae52077cecb22a85ebb4a06fd6397cfe"
          echo "OK: base 10106 exacta."

      - name: Aplicar biblioteca escalable y capas inteligentes 10107
        shell: bash
        env:
          DV6_OPS_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY_PATCH'
          from pathlib import Path
          import os,base64,gzip,json
          path=Path('index.html')
          lines=path.read_text(encoding='utf-8').splitlines(keepends=True)
          ops=json.loads(gzip.decompress(base64.b64decode(os.environ['DV6_OPS_B64'])).decode('utf-8'))
          for i1,i2,new_text in reversed(ops):
              lines[i1:i2]=new_text.splitlines(keepends=True)
          path.write_text(''.join(lines),encoding='utf-8')
          PY_PATCH

          cat > version.json <<'EOF_VERSION'
          {
            "version": 10107,
            "displayVersion": "1.1.1",
            "build": "2026.10.05-10107",
            "date": "5 oct 2026",
            "title": "Biblioteca escalable y capas inteligentes",
            "updateRequired": false,
            "changes": [
              "Descompone solicitudes de ambiente compuestas en capas independientes para buscar cada sonido por separado.",
              "Usa la propia biblioteca para inferir si cada componente debe comportarse como Ambiente, SFX o Vocalización, permitiendo que el reconocimiento mejore a medida que crece la colección.",
              "Amplía el reconocimiento de sonidos sin depender de una lista cerrada de acciones ni descartar coincidencias válidas por una familia demasiado estricta.",
              "Conserva SFX normales cuando entra un diálogo y corta únicamente vocalizaciones que puedan invadir la voz.",
              "Reutiliza efectos SFX ya detectados por el analizador dentro de la narración cuando corresponden a una acción que el narrador está contando.",
              "Corrige el botón de prueba de sonido para que el estado de detener no vuelva a iniciar el audio.",
              "Muestra en cada capa, con mayor tamaño, el sonido exacto que DramaVoice está buscando; si falta, lo indica explícitamente para poder agregarlo a la biblioteca.",
              "Mantiene la caché de la biblioteca y la invalida únicamente al agregar, editar o eliminar sonidos para conservar rendimiento con colecciones grandes.",
              "Actualización exclusivamente web: no modifica el APK, el puente Android, la firma ni los datos locales."
            ]
          }
          EOF_VERSION

          sed -i "s/1\.1\.1-10106/1.1.1-10107/" service-worker.js

      - name: Validar build10107
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "62372ed010742ecc177c1f49fe35f0346cd7d444"
          test "$(git hash-object version.json)" = "85a2b8b5e463b7e4804e4023364acecd8974f097"
          test "$(git hash-object service-worker.js)" = "0ecbd63d2c015e85d42039b63b9784a7317a3b90"

          grep -q '<meta name="dv6-version" content="10107">' index.html
          grep -q 'const DV6_APP_VERSION=10107;' index.html
          grep -q 'findBestSoundMatchAnyType' index.html
          grep -q 'SONIDO SOLICITADO' index.html
          grep -q 'narratorLinkedSfxActions' index.html
          grep -q "if(button?._dvPreviewAudio){stopPreviewButton(button);return}" index.html
          grep -q "a._dvEventType=layerEv.type" index.html
          grep -q 'dv6SoundLookupCache' index.html

          ! grep -q '__DV6_ANDROID_TTS_V55_PATCHED' index.html
          ! grep -q 'speakNarrator' index.html
          ! grep -q 'synthesizeToFile' index.html
          ! grep -q 'PresetReverb.PRESET_PLATE' index.html

          python - <<'PY_JS'
          from pathlib import Path
          import re,subprocess,tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
              if 'src=' in m.group(0).split('>')[0].lower():
                  continue
              if m.group(1).strip(): blocks.append(m.group(1))
          assert len(blocks)==13, f'Esperaba 13 scripts; encontré {len(blocks)}'
          with tempfile.TemporaryDirectory() as d:
              for i,body in enumerate(blocks,1):
                  p=Path(d)/f'{i:02d}.js'
                  p.write_text(body,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
          print('OK: 13 bloques JavaScript válidos.')
          PY_JS

          python -m json.tool version.json >/dev/null
          node --check service-worker.js
          git diff --check

          BAD="$(git diff --name-only | grep -vE '^(index\.html|version\.json|service-worker\.js)$' || true)"
          test -z "$BAD"
          echo "OK: 10107 solo modifica la web."

      - name: Publicar build10107
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "DramaVoice 6 build10107: biblioteca escalable y capas inteligentes"
          git push
