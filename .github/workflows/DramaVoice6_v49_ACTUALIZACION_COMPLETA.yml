name: Actualizar DramaVoice 6 interfaz v49

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DramaVoice6_v49_ACTUALIZACION_COMPLETA.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar actualización v49
        run: |
          echo '' | base64 --decode > /tmp/dv49_patch.py
          python3 /tmp/dv49_patch.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "DramaVoice Builder"
          git config user.email "actions@github.com"
          git add index.html version.json service-worker.js

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi

          git commit -m "DramaVoice 6 v49: interfaz, personajes, sonidos y escenas"
          git push
