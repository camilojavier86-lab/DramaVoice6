name: DramaVoice 6 APK - CORREGIDO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create standard Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/dramavoice6/app
          mkdir -p app/src/main/res/drawable

          cp MainActivity.java app/src/main/java/com/dramavoice6/app/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp dv6_icon.png app/src/main/res/drawable/dv6_icon.png

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DramaVoice6"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.dramavoice6.app"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.dramavoice6.app"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                  }
              }
          }
          EOF

          echo "Standard Android project created."
          find app -maxdepth 6 -type f -print

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DramaVoice6-debug.apk
          ls -lh DramaVoice6-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DramaVoice6-APK
          path: DramaVoice6-debug.apk
          if-no-files-found: error
