name: Actualizar DramaVoice 6 v1.0.4 - Editor de sonidos estable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar v1.0.4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          INDEX = Path("index.html")
          VERSION = Path("version.json")
          SW = Path("service-worker.js")

          if not INDEX.exists():
              raise SystemExit("ERROR: no existe index.html")
          if not VERSION.exists():
              raise SystemExit("ERROR: no existe version.json")
          if not SW.exists():
              raise SystemExit("ERROR: no existe service-worker.js")

          html = INDEX.read_text(encoding="utf-8")

          if "renderSceneSoundEditor" not in html or "renderScenes" not in html:
              raise SystemExit("ERROR: no se encontró el editor de escenas esperado. No se modificó la app.")

          marker = "DV6_EDITOR_STABLE_V104"

          patch = r'''
          <script id="dv6-editor-stable-v104">
          (()=>{
            if(window.__DV6_EDITOR_STABLE_V104)return;
            window.__DV6_EDITOR_STABLE_V104=true;

            const originalRenderScenes=window.renderScenes;
            if(typeof originalRenderScenes!=='function'){
              console.warn('DV6 v1.0.4: renderScenes no disponible; parche de editor no aplicado.');
              return;
            }

            function currentLogicalEditorKey(){
              try{
                if(typeof openSceneSoundEditor!=='undefined')return String(openSceneSoundEditor||'');
              }catch(e){}
              return null;
            }

            function editorSnapshot(){
              const root=document.querySelector('#sceneList');
              if(!root)return null;

              const sceneCards=[...root.querySelectorAll('.scene-card')];
              const openScenes=[];
              sceneCards.forEach((card,index)=>{
                const d=card.querySelector('.scene-details');
                if(d?.open)openScenes.push(index);
              });

              const domOpen=root.querySelector('.sound-event-card[open]');
              const logical=currentLogicalEditorKey();
              const editorKey=logical===null ? String(domOpen?.dataset?.editorKey||'') : logical;

              let anchor=domOpen;
              let layerIndex=-1;
              let focusClass='';
              let focusTag='';

              const active=document.activeElement;
              if(domOpen && active && domOpen.contains(active)){
                const layer=active.closest?.('.sound-layer-card');
                if(layer){
                  const layers=[...domOpen.querySelectorAll('.sound-layer-card')];
                  layerIndex=layers.indexOf(layer);
                  anchor=layer;
                }else{
                  anchor=active.closest?.('.sound-event-body') || domOpen;
                }

                focusTag=String(active.tagName||'').toLowerCase();
                const generic=new Set(['btn','small','aqua','danger','recording-live']);
                focusClass=[...active.classList].find(c=>!generic.has(c))||'';
              }

              return {
                openScenes,
                editorKey,
                layerIndex,
                focusClass,
                focusTag,
                anchorTop:anchor?.getBoundingClientRect?.().top ?? null,
                scrollY:window.scrollY
              };
            }

            function restoreEditorSnapshot(state){
              if(!state)return;
              const root=document.querySelector('#sceneList');
              if(!root)return;

              const sceneCards=[...root.querySelectorAll('.scene-card')];
              for(const index of state.openScenes||[]){
                const d=sceneCards[index]?.querySelector('.scene-details');
                if(d)d.open=true;
              }

              let editor=null;
              if(state.editorKey){
                editor=[...root.querySelectorAll('.sound-event-card')].find(
                  x=>String(x.dataset?.editorKey||'')===String(state.editorKey)
                )||null;

                if(editor){
                  const parent=editor.closest('.scene-details');
                  if(parent)parent.open=true;
                  editor.open=true;
                  try{
                    if(typeof openSceneSoundEditor!=='undefined'){
                      openSceneSoundEditor=String(state.editorKey);
                    }
                  }catch(e){}
                }
              }

              let anchor=editor;
              if(editor && Number.isInteger(state.layerIndex) && state.layerIndex>=0){
                anchor=editor.querySelectorAll('.sound-layer-card')[state.layerIndex]||editor;
              }

              if(editor && state.focusClass){
                const scope=(Number.isInteger(state.layerIndex)&&state.layerIndex>=0)
                  ? (editor.querySelectorAll('.sound-layer-card')[state.layerIndex]||editor)
                  : editor;
                const selector=(state.focusTag||'')+'.'+CSS.escape(state.focusClass);
                const candidate=scope.querySelector(selector);
                if(candidate){
                  try{candidate.focus({preventScroll:true})}catch(e){}
                }
              }

              if(anchor && state.anchorTop!=null){
                const newTop=anchor.getBoundingClientRect().top;
                const delta=newTop-state.anchorTop;
                if(Number.isFinite(delta)&&Math.abs(delta)>0.5){
                  window.scrollBy(0,delta);
                }
              }else if(Number.isFinite(state.scrollY)){
                window.scrollTo(0,state.scrollY);
              }
            }

            window.renderScenes=async function(...args){
              const state=editorSnapshot();
              const result=await originalRenderScenes.apply(this,args);
              restoreEditorSnapshot(state);
              requestAnimationFrame(()=>restoreEditorSnapshot(state));
              return result;
            };

            console.info('DV6 v1.0.4: editor de sonidos estable activo.');
          })();
          </script>
          '''.strip()

          if marker not in html:
              if "</body>" not in html:
                  raise SystemExit("ERROR: index.html no contiene </body>")
              html = html.replace("</body>", patch + "\n</body>", 1)

          html, n_meta = re.subn(
              r'<meta name="dv6-version" content="[^"]*">',
              '<meta name="dv6-version" content="10004">',
              html, count=1
          )
          if n_meta != 1:
              raise SystemExit("ERROR: no se pudo actualizar meta dv6-version")

          html, n_app = re.subn(
              r'const\s+DV6_APP_VERSION\s*=\s*\d+\s*;',
              'const DV6_APP_VERSION=10004;',
              html, count=1
          )
          if n_app != 1:
              raise SystemExit("ERROR: no se pudo actualizar DV6_APP_VERSION")

          html, n_visible = re.subn(
              r'Versión instalada:\s*[^<]+',
              'Versión instalada: v1.0.4',
              html, count=1
          )
          if n_visible != 1:
              raise SystemExit("ERROR: no se pudo actualizar la versión visible en Ajustes")

          html = re.sub(
              r'<title>DramaVoice 6[^<]*</title>',
              '<title>DramaVoice 6 v1.0.4</title>',
              html, count=1
          )

          INDEX.write_text(html, encoding="utf-8")

          version_data = {
              "version": 10004,
              "displayVersion": "1.0.4",
              "build": "2026.09.27.10004",
              "date": "27 sep 2026",
              "title": "Editor de sonidos estable",
              "updateRequired": False,
              "changes": [
                  "Mantiene abierto el mismo evento de sonido mientras editas.",
                  "Conserva visible la misma capa y la posición de desplazamiento después de cambios que vuelven a dibujar la escena.",
                  "Evita que el editor salte hacia arriba al cambiar selección, tipo, archivo, capa u otros datos que refrescan Escenas.",
                  "No modifica las voces Android, personajes, sonidos guardados ni el contenedor APK.",
                  "No modifica el comportamiento de la barra superior ni de la muesca del teléfono."
              ]
          }
          VERSION.write_text(
              json.dumps(version_data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          sw = SW.read_text(encoding="utf-8")
          sw, n_sw = re.subn(
              r"const\s+DV6_SW_VERSION\s*=\s*['\"][^'\"]+['\"]\s*;",
              "const DV6_SW_VERSION='1.0.4';",
              sw, count=1
          )
          if n_sw != 1:
              raise SystemExit("ERROR: no se pudo actualizar DV6_SW_VERSION")
          SW.write_text(sw, encoding="utf-8")

          print("v1.0.4 preparada correctamente.")
          PY

      - name: Validar actualización
        shell: bash
        run: |
          set -e
          grep -q "DV6_EDITOR_STABLE_V104" index.html
          grep -q "const DV6_APP_VERSION=10004;" index.html
          grep -q "Versión instalada: v1.0.4" index.html
          grep -q "DV6_SW_VERSION='1.0.4'" service-worker.js
          grep -q '"displayVersion": "1.0.4"' version.json
          grep -q '"version": 10004' version.json

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html service-worker.js version.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "ERROR: se modificaron archivos inesperados:"
            echo "$changed"
            exit 1
          fi

          git diff --check
          echo "OK: v1.0.4 validada. No se modificó el APK."

      - name: Guardar actualización
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "No hay cambios nuevos que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          git commit -m "DramaVoice 6 v1.0.4: editor de sonidos estable"
          git push
