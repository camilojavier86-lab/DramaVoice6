        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html version.json service-worker.js

          if git diff --cached --quiet; then
            echo "build10104 ya estaba aplicada; no hay cambios que publicar."
            exit 0
          fi

          git commit -m "DramaVoice 6 v1.1.1 build10104: reparar importacion y sonidos"
          git push
