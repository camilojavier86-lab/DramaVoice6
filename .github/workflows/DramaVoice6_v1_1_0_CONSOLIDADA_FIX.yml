name: DramaVoice 6 v1.1.0 - Actualización consolidada

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore persistent DV6 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dramavoice6-signing-v54-v1

      - name: Ensure persistent signing key
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=DramaVoice 6,O=K-MILO,C=PA"               -keyalg RSA -keysize 2048 -validity 10000
          fi

          keytool -list -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey | grep -E "SHA256:|Valid from:" | tee DV6_SIGNING_FINGERPRINT.txt

      - name: Aplicar DramaVoice v1.1.0 web
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re

          INDEX=Path("index.html")
          VERSION=Path("version.json")
          SW=Path("service-worker.js")

          for p in (INDEX,VERSION,SW):
              if not p.exists():
                  raise SystemExit(f"ERROR: falta {p}")

          current=json.loads(VERSION.read_text(encoding="utf-8"))
          if int(current.get("version",0) or 0)>10100:
              raise SystemExit("ERROR: el repositorio ya contiene una versión posterior a v1.1.0.")

          patch=base64.b64decode("").decode("utf-8")
          Path("dv110_patch_check.js").write_text(patch,encoding="utf-8")

          html=INDEX.read_text(encoding="utf-8")
          if "renderScenes" not in html or "playBtn" not in html or "sound-event-card" not in html:
              raise SystemExit("ERROR: la base actual no contiene la estructura esperada.")

          if "__DV6_V110" not in html:
              if "</body>" not in html:
                  raise SystemExit("ERROR: index.html no contiene </body>.")
              html=html.replace("</body>",'<script id="dv6-v110-patch">\n'+patch+'\n</script>\n</body>',1)

          html,n=re.subn(
              r'<meta name="dv6-version" content="[^"]*">',
              '<meta name="dv6-version" content="10100">',
              html,count=1
          )
          if n!=1:
              raise SystemExit("ERROR: no se pudo actualizar meta dv6-version.")

          html,n=re.subn(
              r'const\s+DV6_APP_VERSION\s*=\s*\d+\s*;',
              'const DV6_APP_VERSION=10100;',
              html,count=1
          )
          if n!=1:
              raise SystemExit("ERROR: no se pudo actualizar DV6_APP_VERSION.")

          html=re.sub(
              r'<title>DramaVoice 6[^<]*</title>',
              '<title>DramaVoice 6 v1.1.0</title>',
              html,count=1
          )
          html=re.sub(
              r'Versión instalada:\s*[^<]+',
              'Versión instalada: v1.1.0',
              html,count=1
          )

          html=html.replace("const DV105_VERSION=10005;","const DV105_VERSION=10100;")
          html=html.replace("const DV105_DISPLAY='1.0.5';","const DV105_DISPLAY='1.1.0';")
          html=html.replace("const DV105_BUILD='2026.09.27-10005';","const DV105_BUILD='2026.09.28-10100';")

          INDEX.write_text(html,encoding="utf-8")

          VERSION.write_text(json.dumps({
              "version":10100,
              "displayVersion":"1.1.0",
              "build":"2026.09.28-10100",
              "date":"28 sep 2026",
              "title":"Producción sonora y reproductor DramaVoice",
              "updateRequired":False,
              "changes":[
                  "Evita el duplicado temporal de tarjetas al abrir Escenas después de analizar una historia.",
                  "Los prompts pegados fuera de las escenas se vinculan de forma estricta al personaje correspondiente y la ficha muestra el prompt en lugar del resumen narrativo contaminado.",
                  "Elegir archivo, Grabar y Crear sonido nuevo desde una capa abren el editor completo del sonido antes de guardarlo en Biblioteca.",
                  "Los sonidos creados desde Escenas guardan nombre, descripción, tipo, familia, categoría, palabras clave, archivo original y duración.",
                  "Cada evento de sonido permite escuchar la mezcla completa de todas sus capas respetando volumen, recortes y retardos.",
                  "El Reproductor elimina información repetida, mantiene visible el lugar actual, resalta hablante, capítulo y escena y usa controles más grandes.",
                  "Play y Pausa se unifican en un único botón central redondo; anterior, siguiente y detener se conservan.",
                  "Al terminar el capítulo, Detener se transforma en Nuevo capítulo y lleva a la captura de Historia.",
                  "El reproductor añade halo de voz, fondo atmosférico, waveform, pulso de SFX, transición de ubicación y anillo de progreso sin animar los rostros.",
                  "El APK aplica un inset superior real para que DramaVoice no dibuje debajo de la muesca o barra de estado.",
                  "Se conserva Android TTS nativo, datos locales, firma persistente y actualizador sin cierre manual."
              ]
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          sw=SW.read_text(encoding="utf-8")
          sw,n=re.subn(
              r"const\s+DV6_SW_VERSION\s*=\s*['\"][^'\"]+['\"]\s*;",
              "const DV6_SW_VERSION='1.1.0';",
              sw,count=1
          )
          if n!=1:
              raise SystemExit("ERROR: no se pudo actualizar DV6_SW_VERSION.")
          SW.write_text(sw,encoding="utf-8")
          PY

      - name: Validar web v1.1.0
        shell: bash
        run: |
          set -e
          node --check dv110_patch_check.js
          rm -f dv110_patch_check.js

          grep -q "__DV6_V110" index.html
          grep -q "DV6_APP_VERSION=10100;" index.html
          grep -q "const DV105_VERSION=10100;" index.html
          grep -q "const DV105_DISPLAY='1.1.0';" index.html
          grep -q "const DV105_BUILD='2026.09.28-10100';" index.html
          grep -q '"displayVersion": "1.1.0"' version.json
          grep -q '"build": "2026.09.28-10100"' version.json
          grep -q "DV6_SW_VERSION='1.1.0'" service-worker.js
          grep -q "Escuchar mezcla completa" index.html
          grep -q "PROMPT DEL PERSONAJE" index.html
          grep -q "Nuevo" index.html
          grep -q "capítulo" index.html

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html service-worker.js version.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "ERROR: se modificaron archivos inesperados:"
            echo "$changed"
            exit 1
          fi

          git diff --check
          echo "OK: interfaz v1.1.0 validada."

      - name: Publicar web v1.1.0
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js

          if ! git diff --cached --quiet; then
            git commit -m "DramaVoice 6 v1.1.0: producción sonora y reproductor"
            git push
          else
            echo "La interfaz v1.1.0 ya estaba publicada."
          fi

      - name: Crear proyecto Android desde la base estable
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          src_path=Path(".github/workflows/DramaVoice6_v54_ANDROID_TTS.yml")
          if not src_path.exists():
              raise SystemExit("ERROR: falta DramaVoice6_v54_ANDROID_TTS.yml, base del contenedor Android.")

          src=src_path.read_text(encoding="utf-8")
          step="      - name: Create Android v54 project\n"
          if step not in src:
              raise SystemExit("ERROR: no se encontró la receta Android estable.")

          start=src.index(step)
          run_marker="        run: |\n"
          run_pos=src.index(run_marker,start)+len(run_marker)
          end_marker="\n      - name: Validate v54 voice architecture"
          end=src.index(end_marker,run_pos)
          body=textwrap.dedent(src[run_pos:end])

          Path("create_android_v110.sh").write_text(body,encoding="utf-8")
          PY

          bash create_android_v110.sh

      - name: Aplicar contenedor Android v1.1.0
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle=Path("app/build.gradle.kts")
          s=gradle.read_text(encoding="utf-8")
          if 'versionCode = 54' not in s or 'versionName = "54.0"' not in s:
              raise SystemExit("ERROR: la base Android no tiene la versión esperada.")
          s=s.replace('versionCode = 54','versionCode = 56',1)
          s=s.replace('versionName = "54.0"','versionName = "1.1.0"',1)
          gradle.write_text(s,encoding="utf-8")

          java=Path("app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java")
          s=java.read_text(encoding="utf-8")

          if "import android.graphics.Color;" not in s:
              raise SystemExit("ERROR: imports Android inesperados.")
          s=s.replace(
              "import android.graphics.Color;",
              "import android.graphics.Color;\nimport android.graphics.Insets;\nimport android.os.Build;\nimport android.view.WindowInsets;",
              1
          )

          if "settings.setCacheMode(WebSettings.LOAD_DEFAULT);" not in s:
              raise SystemExit("ERROR: no se encontró LOAD_DEFAULT.")
          s=s.replace(
              "settings.setCacheMode(WebSettings.LOAD_DEFAULT);",
              "settings.setCacheMode(WebSettings.LOAD_NO_CACHE);",
              1
          )

          inset_code='''setContentView(webView);

                  webView.setBackgroundColor(Color.rgb(7, 9, 13));
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      webView.setOnApplyWindowInsetsListener((v, insets) -> {
                          Insets topInsets = insets.getInsets(
                                  WindowInsets.Type.statusBars() | WindowInsets.Type.displayCutout()
                          );
                          v.setPadding(0, topInsets.top, 0, 0);
                          return insets;
                      });
                      webView.requestApplyInsets();
                  } else {
                      int statusBarRes = getResources().getIdentifier("status_bar_height", "dimen", "android");
                      int top = statusBarRes > 0 ? getResources().getDimensionPixelSize(statusBarRes) : 0;
                      webView.setPadding(0, top, 0, 0);
                  }'''
          if "setContentView(webView);" not in s:
              raise SystemExit("ERROR: no se encontró setContentView.")
          s=s.replace("setContentView(webView);",inset_code,1)

          if "webView.loadUrl(APP_URL);" not in s:
              raise SystemExit("ERROR: no se encontró carga inicial APP_URL.")
          s=s.replace(
              "webView.loadUrl(APP_URL);",
              'webView.loadUrl(APP_URL + "?androidShell=56&dv6=10100&t=" + System.currentTimeMillis());',
              1
          )
          java.write_text(s,encoding="utf-8")

          bridge=Path("app/src/main/assets/native-bridge.js")
          s=bridge.read_text(encoding="utf-8")
          s=s.replace(
              "if(sub)sub.textContent='v54 · Android TTS nativo';",
              "/* v1.1.0: la versión visible la controla la interfaz web. */"
          )
          s=s.replace(
              "if(versionLine)versionLine.textContent='Versión instalada: v54 Android TTS';",
              "/* v1.1.0: no sobreescribir la versión funcional. */"
          )

          old_wf=Path(".github/workflows/DramaVoice6_v1_0_5_ANDROID_ACTUALIZADOR.yml")
          if not old_wf.exists():
              raise SystemExit("ERROR: falta el workflow Android v1.0.5 usado como referencia del actualizador.")
          text=old_wf.read_text(encoding="utf-8")
          m=re.search(r"hard_patch=r'''(.*?)\n          '''",text,re.S)
          if not m:
              raise SystemExit("ERROR: no pude recuperar el actualizador Android probado.")
          hard=m.group(1)
          hard=hard.replace("__DV6_ANDROID_SHELL_V55","__DV6_ANDROID_SHELL_V56")
          hard=hard.replace("dv6-v55-return-tab","dv6-v56-return-tab")
          hard=hard.replace("dv55Bound","dv56Bound")
          hard=hard.replace("DV6 Android v55 updater","DV6 Android v1.1.0 updater")
          bridge.write_text(s+"\n"+hard+"\n",encoding="utf-8")
          PY

      - name: Validar Android v1.1.0
        shell: bash
        run: |
          set -e
          grep -q 'versionCode = 56' app/build.gradle.kts
          grep -q 'versionName = "1.1.0"' app/build.gradle.kts
          grep -q 'WebSettings.LOAD_NO_CACHE' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'WindowInsets.Type.statusBars()' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'WindowInsets.Type.displayCutout()' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'androidShell=56&dv6=10100' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q '__DV6_ANDROID_SHELL_V56' app/src/main/assets/native-bridge.js
          grep -q 'getRegistrations' app/src/main/assets/native-bridge.js
          grep -q 'caches.keys' app/src/main/assets/native-bridge.js
          grep -q 'Android TTS conectado' app/src/main/assets/native-bridge.js
          grep -q 'new TextToSpeech(context, status ->' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'Set<Voice> voiceSet = tts.getVoices()' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java

          if grep -Rni 'SUPERTONIC_ENGINE\|com.dramavoice6.supertonic\|DV6 Supertonic' app/src/main; then
            echo "ERROR: apareció una dependencia Supertonic."
            exit 1
          fi

          echo "OK: Android v1.1.0 conserva TTS, firma y datos, y excluye la muesca del contenido."

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e
          curl -L --fail --retry 4             "https://services.gradle.org/distributions/gradle-8.9-bin.zip"             -o gradle.zip
          unzip -q gradle.zip

      - name: Build DramaVoice 6 v1.1.0 APK
        shell: bash
        run: |
          set -e
          ./gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DramaVoice6-v1.1.0-build10100.apk
          ls -lh DramaVoice6-v1.1.0-build10100.apk

      - name: Upload APK v1.1.0
        uses: actions/upload-artifact@v4
        with:
          name: DramaVoice6-v1.1.0-build10100
          path: |
            DramaVoice6-v1.1.0-build10100.apk
            DV6_SIGNING_FINGERPRINT.txt
          if-no-files-found: error
          retention-days: 30
