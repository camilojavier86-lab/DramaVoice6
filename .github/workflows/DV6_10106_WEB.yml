name: DramaVoice 6 v1.1.1 - Audio natural web build10106

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verificar base exacta 10105
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "367a3fb9fe935e6e885dbb34841b1158468e3364"
          test "$(git hash-object version.json)" = "69f09aa3db9fcdcd7b1547fdb65eccc0b888b84f"
          test "$(git hash-object service-worker.js)" = "9c9f03a3259ef2f0685084bb0323c3eb695c32b7"
          echo "OK: base 10105 exacta."

      - name: Aplicar dirección automática de audio 10106
        shell: bash
        env:
          DV6_OPS_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY_PATCH'
          from pathlib import Path
          import os,base64,gzip,json

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          lines=text.splitlines(keepends=True)
          ops=json.loads(gzip.decompress(base64.b64decode(os.environ['DV6_OPS_B64'])).decode('utf-8'))
          for i1,i2,new_text in reversed(ops):
              lines[i1:i2]=new_text.splitlines(keepends=True)
          path.write_text(''.join(lines),encoding='utf-8')
          PY_PATCH

          cat > version.json <<'EOF_VERSION'
          {
            "version": 10106,
            "displayVersion": "1.1.1",
            "build": "2026.10.05-10106",
            "date": "5 oct 2026",
            "title": "Dirección automática de audio y efectos narrados",
            "updateRequired": false,
            "changes": [
              "Integra el buscador de sonidos aprobado en Escenas para localizar, filtrar, preescuchar y asignar sonidos sin recorrer listas largas.",
              "Corrige el cierre de capas de sonido adicionales para que una capa eliminada no reaparezca automáticamente.",
              "Añade pausas automáticas más naturales entre narrador y personajes, evitando un ritmo fijo o mecánico.",
              "Evita que vocalizaciones y efectos puntuales se prolonguen encima del diálogo que sigue.",
              "Permite que acciones descritas por el narrador disparen efectos compatibles durante la propia narración.",
              "Suaviza los bucles ambientales con crossfade y desvanece el ambiente al terminar la reproducción.",
              "Añade transiciones de audio más suaves entre lugares o ambientes.",
              "Actualización exclusivamente web: no modifica el APK, el puente Android, la firma ni los datos locales."
            ]
          }
          EOF_VERSION

          sed -i "s/1\.1\.1-10105/1.1.1-10106/" service-worker.js

      - name: Validar build10106 web
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "45472725803b6c7b5a1a622d3cb356c5d0ab213b"
          test "$(git hash-object version.json)" = "0a7a7f0d15eb27d6d355c2dd34e5abee09995876"
          test "$(git hash-object service-worker.js)" = "c5c74481ae52077cecb22a85ebb4a06fd6397cfe"

          grep -q '<meta name="dv6-version" content="10106">' index.html
          grep -q 'const DV6_APP_VERSION=10106;' index.html
          grep -q 'dv6SoundPicker' index.html
          grep -q '__DV6_AUTO_DIRECTION_10106_CORE' index.html
          grep -q '__DV6_AUTO_DIRECTION_10106_NATURAL' index.html
          grep -q 'p8NarratedConsumedSfx' index.html
          grep -q 'stopAmbientP7' index.html

          ! grep -q '__DV6_AUTO_DIRECTION_LAB_P6' index.html
          ! grep -q '__DV6_AUTO_DIRECTION_LAB_P8' index.html
          ! grep -q '__DV6_ANDROID_TTS_V55_PATCHED' index.html
          ! grep -q 'speakNarrator' index.html
          ! grep -q 'synthesizeToFile' index.html
          ! grep -q 'PresetReverb.PRESET_PLATE' index.html

          python - <<'PY_JS'
          from pathlib import Path
          import re,subprocess,tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I):
              if 'src=' in m.group(0).split('>')[0].lower():
                  continue
              body=m.group(1)
              if body.strip(): blocks.append(body)
          assert len(blocks)==13, f'Esperaba 13 scripts; encontré {len(blocks)}'
          with tempfile.TemporaryDirectory() as d:
              for i,body in enumerate(blocks,1):
                  p=Path(d)/f'{i:02d}.js'
                  p.write_text(body,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
          print('OK: 13 bloques JavaScript válidos.')
          PY_JS

          python -m json.tool version.json >/dev/null
          node --check service-worker.js
          git diff --check

          BAD="$(git diff --name-only | grep -vE '^(index\.html|version\.json|service-worker\.js)$' || true)"
          test -z "$BAD"
          echo "OK: 10106 es exclusivamente web. APK y Android intactos."

      - name: Publicar build10106
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          git commit -m "DramaVoice 6 v1.1.1 build10106: dirección automática de audio"
          git push
