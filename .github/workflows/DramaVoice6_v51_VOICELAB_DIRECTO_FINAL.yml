name: Build DramaVoice 6 v51 VoiceLab Directo FINAL

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DramaVoice6_v51_VOICELAB_DIRECTO_FINAL.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone sherpa-onnx v1.13.8
        run: git clone --depth 1 --branch v1.13.8 https://github.com/k2-fsa/sherpa-onnx.git sherpa-onnx

      - name: Download official Supertonic package
        run: |
          curl -L --fail --retry 5 "https://huggingface.co/csukuangfj2/sherpa-onnx-apk/resolve/main/tts-engine-new/1.13.8/sherpa-onnx-1.13.8-arm64-v8a-eng-tts-engine-sherpa-onnx-supertonic-3-tts-int8-2026-05-11.apk?download=true" -o official-supertonic.apk
          rm -rf official-apk
          mkdir -p official-apk
          unzip -q official-supertonic.apk -d official-apk
          test -d official-apk/assets
          test -d official-apk/lib/arm64-v8a

      - name: Embed Supertonic model and native libraries
        run: |
          APP="sherpa-onnx/android/SherpaOnnxTts/app/src/main"
          mkdir -p "$APP/assets" "$APP/jniLibs/arm64-v8a"
          cp -a official-apk/assets/. "$APP/assets/"
          cp -a official-apk/lib/arm64-v8a/. "$APP/jniLibs/arm64-v8a/"

      - name: Patch VoiceLab source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("sherpa-onnx/android/SherpaOnnxTts")

          # 1) Unique package id for this temporary test app
          gradle = root / "app/build.gradle"
          g = gradle.read_text(encoding="utf-8")
          required_gradle = {
              'applicationId "com.k2fsa.sherpa.onnx"': 'applicationId "com.dramavoice6.voicelab"',
              'versionCode 20260910': 'versionCode 51',
              'versionName "1.13.8"': 'versionName "51.0-voicelab"',
          }
          for old, new in required_gradle.items():
              if old not in g:
                  raise RuntimeError(f"Missing Gradle text: {old}")
              g = g.replace(old, new, 1)
          gradle.write_text(g, encoding="utf-8")

          # 2) FileProvider must match the new package
          manifest = root / "app/src/main/AndroidManifest.xml"
          m = manifest.read_text(encoding="utf-8")
          old_auth = 'android:authorities="com.k2fsa.sherpa.onnx.fileprovider"'
          new_auth = 'android:authorities="com.dramavoice6.voicelab.fileprovider"'
          if old_auth not in m:
              raise RuntimeError("Missing FileProvider authority in manifest")
          manifest.write_text(m.replace(old_auth, new_auth, 1), encoding="utf-8")

          # 3) Give the test app a clear name
          strings = root / "app/src/main/res/values/strings.xml"
          s = strings.read_text(encoding="utf-8")
          if '<string name="app_name">TTS</string>' not in s:
              raise RuntimeError("Missing app_name")
          s = s.replace(
              '<string name="app_name">TTS</string>',
              '<string name="app_name">DV6 VoiceLab v51</string>',
              1,
          )
          strings.write_text(s, encoding="utf-8")

          # 4) Configure the official sample app to use Supertonic directly
          main = root / "app/src/main/java/com/k2fsa/sherpa/onnx/MainActivity.kt"
          t = main.read_text(encoding="utf-8")

          old_provider = '"com.k2fsa.sherpa.onnx.fileprovider"'
          if old_provider not in t:
              raise RuntimeError("Missing FileProvider authority in MainActivity")
          t = t.replace(
              old_provider,
              '"com.dramavoice6.voicelab.fileprovider"',
              1,
          )

          old_sample = 'val sampleText = ""'
          if old_sample not in t:
              raise RuntimeError("Missing sample text marker")
          t = t.replace(
              old_sample,
              'val sampleText = "Hola. Esta es una prueba directa de Supertonic dentro de DramaVoice."',
              1,
          )

          marker = "    private fun initTts() {"
          if marker not in t:
              raise RuntimeError("Missing initTts()")
          head, tail = t.split(marker, 1)

          local_replacements = {
              'var isSupertonic = false': 'var isSupertonic = true',
              'var supertonicLang: String = "en"': 'var supertonicLang: String = "es"',
              'modelDir = null': 'modelDir = "sherpa-onnx-supertonic-3-tts-int8-2026-05-11"',
              'var durationPredictor: String? = null': 'var durationPredictor: String? = "duration_predictor.int8.onnx"',
              'var textEncoder: String? = null': 'var textEncoder: String? = "text_encoder.int8.onnx"',
              'var vectorEstimator: String? = null': 'var vectorEstimator: String? = "vector_estimator.int8.onnx"',
              'var supertonicVocoder: String? = null': 'var supertonicVocoder: String? = "vocoder.int8.onnx"',
              'var ttsJson: String? = null': 'var ttsJson: String? = "tts.json"',
              'var unicodeIndexer: String? = null': 'var unicodeIndexer: String? = "unicode_indexer.bin"',
              'var voiceStyle: String? = null': 'var voiceStyle: String? = "voice.bin"',
          }

          for old, new in local_replacements.items():
              if old not in tail:
                  raise RuntimeError(f"Missing initTts text: {old}")
              tail = tail.replace(old, new, 1)

          t = head + marker + tail
          main.write_text(t, encoding="utf-8")

          # 5) Verify the exact configuration that matters
          check = main.read_text(encoding="utf-8")
          required = [
              'modelDir = "sherpa-onnx-supertonic-3-tts-int8-2026-05-11"',
              'var isSupertonic = true',
              'var supertonicLang: String = "es"',
              'duration_predictor.int8.onnx',
              'text_encoder.int8.onnx',
              'vector_estimator.int8.onnx',
              'vocoder.int8.onnx',
              'tts.json',
              'unicode_indexer.bin',
              'voice.bin',
          ]
          for item in required:
              if item not in check:
                  raise RuntimeError(f"Missing final config: {item}")

          print("VoiceLab v51 patch verified successfully.")
          PY

      - name: Build VoiceLab APK
        run: |
          cd sherpa-onnx/android/SherpaOnnxTts
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp sherpa-onnx/android/SherpaOnnxTts/app/build/outputs/apk/debug/app-debug.apk DramaVoice6-v51-VoiceLab-Directo.apk
          ls -lh DramaVoice6-v51-VoiceLab-Directo.apk

      - name: Upload VoiceLab artifact
        uses: actions/upload-artifact@v4
        with:
          name: DramaVoice6-v51-VoiceLab-Directo
          path: DramaVoice6-v51-VoiceLab-Directo.apk
          if-no-files-found: error
