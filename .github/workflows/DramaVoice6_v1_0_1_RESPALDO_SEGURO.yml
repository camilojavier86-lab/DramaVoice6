name: Actualizar DramaVoice 6 v1.0.1 respaldo seguro

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/DramaVoice6_v1_0_1_RESPALDO_SEGURO.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar solamente el arreglo de respaldo
        shell: bash
        run: |
          set -e
          echo '' | base64 --decode > /tmp/dv10001_patch.py
          python3 /tmp/dv10001_patch.py

      - name: Validar que la app principal no fue alterada fuera del respaldo
        shell: bash
        run: |
          set -e
          grep -q 'let dvPreparedProjectBackup=null;' index.html
          grep -q 'Guardar respaldo' index.html
          grep -q 'navigator.canShare({files:\[file\]})' index.html
          grep -q 'const DV6_APP_VERSION=10001;' index.html
          grep -q '"displayVersion": "1.0.1"' version.json
          grep -q "DV6_SW_VERSION='1.0.1'" service-worker.js
          if grep -q 'dv110-script' index.html; then
            echo "ERROR: apareció nuevamente el parche v1.1.0 defectuoso"
            exit 1
          fi

      - name: Guardar actualización
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi
          git commit -m "DramaVoice 6 v1.0.1: respaldo seguro Android"
          git push
