name: DramaVoice 6 v1.1.1 - Audio natural + narrador envolvente build10106

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact 10105 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "367a3fb9fe935e6e885dbb34841b1158468e3364"
          test "$(git hash-object version.json)" = "69f09aa3db9fcdcd7b1547fdb65eccc0b888b84f"
          test "$(git hash-object service-worker.js)" = "9c9f03a3259ef2f0685084bb0323c3eb695c32b7"
          test -f .github/workflows/DramaVoice6_v54_ANDROID_TTS.yml
          echo "OK: base web 10105 y puente Android v54 encontrados."

      - name: Apply approved web audio changes
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/dv6-10106.patch
          git apply --check /tmp/dv6-10106.patch
          git apply /tmp/dv6-10106.patch
          echo '' | base64 -d > version.json
          echo '' | base64 -d > service-worker.js

          test "$(git hash-object index.html)" = "76d8a9743312e9a0b07bf900dcf08c02a0007b3b"
          test "$(git hash-object version.json)" = "be9c147bf655950b8b7250d0e2bbaa9cdf5ae62e"
          test "$(git hash-object service-worker.js)" = "c5c74481ae52077cecb22a85ebb4a06fd6397cfe"
          echo "OK: web 10106 reproducida exactamente."

      - name: Validate web 10106
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          assert len(scripts)==13, f"Esperaba 13 scripts, encontré {len(scripts)}"
          for i,js in enumerate(scripts,1):
              p=Path('/tmp')/f'dv6_10106_{i}.js'
              p.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          data=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert data['version']==10106
          assert data['build']=='2026.10.05-10106'
          required=[
              'dv6-sound-picker-open',
              'dismissedLayerCues',
              'dv6AutoDirection10106Core',
              'dv6AutoDirection10106Natural',
              'waitNarratorPlaybackStart',
              "dv6:native-speech-start",
              'p8NarratedConsumedSfx'
          ]
          for token in required:
              assert token in html, token
          # La prueba de 8 rostros fue descartada: conservar exactamente el catálogo actual.
          for token in [
              "{key:'neutral',label:'NEUTRAL'",
              "{key:'happy',label:'FELIZ'",
              "{key:'angry',label:'MOLESTO / SERIO'",
              "{key:'flirty',label:'COQUETO / SEDUCTOR'",
              "{key:'sad',label:'TRISTE / ASUSTADO'"
          ]:
              assert token in html, token
          assert 'dv6FaceCatalog8' not in html
          print('OK: 13 scripts válidos, P8 integrado y 5 rostros conservados.')
          PY

      - name: Rebuild Android project from proven v54 source
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_android_10106.py
          python -m py_compile /tmp/patch_android_10106.py
          python /tmp/patch_android_10106.py

          grep -q 'versionCode = 55' app/build.gradle.kts
          grep -q 'versionName = "55.0"' app/build.gradle.kts
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' app/src/main/AndroidManifest.xml
          grep -q 'synthesizeToFile' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'PresetReverb.PRESET_PLATE' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q 'public boolean speakNarrator' app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          grep -q '__DV6_ANDROID_TTS_V55_PATCHED' app/src/main/assets/native-bridge.js
          grep -q "dv6:native-speech-start" app/src/main/assets/native-bridge.js
          node --check app/src/main/assets/native-bridge.js

          if grep -Rni 'SUPERTONIC_ENGINE\|com.dramavoice6.supertonic\|DV6 Supertonic' app/src/main; then
            echo "ERROR: apareció una dependencia Supertonic en el Android v55."
            exit 1
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png app/src/main/res/drawable/dv6_icon.png
          else
            curl -L --fail --retry 4 \
              "https://raw.githubusercontent.com/camilojavier86-lab/DramaVoice6/main/icon-192.png" \
              -o app/src/main/res/drawable/dv6_icon.png
          fi

          echo "OK: puente v55 preparado con fallback a TTS normal."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore original signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dramavoice6-signing-v54-v1

      - name: Verify signing identity before build
        shell: bash
        run: |
          set -euo pipefail
          KEY="$HOME/.android/debug.keystore"
          if [ ! -f "$KEY" ]; then
            echo "ERROR: no apareció la llave original. Se cancela para no crear un APK con firma distinta."
            exit 1
          fi
          keytool -list -v -keystore "$KEY" -storepass android -alias androiddebugkey | tee DV6_SIGNING_FINGERPRINT.txt
          FP="$(keytool -list -v -keystore "$KEY" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          test "$FP" = "D1:19:8A:C5:72:A1:CB:97:EB:69:00:A8:1D:0E:01:CE:B8:96:E9:CF:AE:5D:42:25:01:49:9B:12:80:5D:71:2C"
          echo "OK: firma original confirmada."

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            -o gradle.zip
          unzip -q gradle.zip

      - name: Compile Android v55
        shell: bash
        run: |
          set -euo pipefail
          ./gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DramaVoice6-v55-Narrador-Envolvente.apk
          ls -lh DramaVoice6-v55-Narrador-Envolvente.apk

      - name: Verify APK certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs DramaVoice6-v55-Narrador-Envolvente.apk | tee APK_CERTIFICATE.txt
          DIGEST="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' APK_CERTIFICATE.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          test "$DIGEST" = "d1198ac572a1cb97eb6900a81d0e01ceb896e9cfae5d422501499b12805d712c"
          echo "OK: APK v55 conserva exactamente la firma instalada."

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: DramaVoice6-v55-Narrador-Envolvente
          path: |
            DramaVoice6-v55-Narrador-Envolvente.apk
            DV6_SIGNING_FINGERPRINT.txt
            APK_CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish web build 10106
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json service-worker.js
          git diff --cached --check
          git commit -m "DramaVoice 6 build10106: audio natural y narrador envolvente"
          git push
          echo "OK: web 10106 publicada después de validar el APK."
