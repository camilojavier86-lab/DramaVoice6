name: Build DramaVoice 6 v48 Native Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/dramavoice6/nativeapp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          echo '' | base64 --decode > settings.gradle.kts
          echo 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKfQo=' | base64 --decode > build.gradle.kts
          echo '' | base64 --decode > app/build.gradle.kts
          echo '' | base64 --decode > app/src/main/AndroidManifest.xml
          echo '' | base64 --decode > app/src/main/res/values/styles.xml
          echo '' | base64 --decode > app/src/main/java/com/dramavoice6/nativeapp/MainActivity.java
          echo '' | base64 --decode > app/src/main/assets/native-bridge.js
          curl -L --fail --retry 4 "https://raw.githubusercontent.com/camilojavier86-lab/DramaVoice6/main/icon-192.png" -o app/src/main/res/drawable/dv6_icon.png

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -L --fail --retry 4 "https://services.gradle.org/distributions/gradle-8.9-bin.zip" -o gradle.zip
          unzip -q gradle.zip

      - name: Build DramaVoice APK
        shell: bash
        run: |
          set -e
          ./gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DramaVoice6-v48-Supertonic-Bridge.apk
          ls -lh DramaVoice6-v48-Supertonic-Bridge.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DramaVoice6-v48-Supertonic-Bridge
          path: DramaVoice6-v48-Supertonic-Bridge.apk
          if-no-files-found: error
